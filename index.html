<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교회 피클볼 대회 실시간 전광판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white select-none">
    <div id="root"></div>

    <script type="text/babel">
        // --- 로컬 스토리지 엔진 ---
        const getLocalStorage = (key, defaultVal) => {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : defaultVal;
        };
        const setLocalStorage = (key, val) => {
            localStorage.setItem(key, JSON.stringify(val));
            window.dispatchEvent(new Event('storage_update'));
        };

        const buildInitialTeams = (countA, countB) => {
            const arr = [];
            for(let i=1; i<=countA; i++) arr.push({ id: `A${i}`, group: 'A', name: `A${i}팀`, player1: `선수 ${i}A`, player2: `선수 ${i}B` });
            for(let i=1; i<=countB; i++) arr.push({ id: `B${i}`, group: 'B', name: `B${i}팀`, player1: `성도 ${i}A`, player2: `성도 ${i}B` });
            return arr;
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('tv');
            const [tournamentType, setTournamentType] = React.useState(() => getLocalStorage('pb_type', 'league'));
            
            const [numTeamsA, setNumTeamsA] = React.useState(() => getLocalStorage('pb_numTeamsA', 6));
            const [numTeamsB, setNumTeamsB] = React.useState(() => getLocalStorage('pb_numTeamsB', 9));
            const [maxGamesA, setMaxGamesA] = React.useState(() => getLocalStorage('pb_maxGamesA', 5));
            const [maxGamesB, setMaxGamesB] = React.useState(() => getLocalStorage('pb_maxGamesB', 5));

            const [teams, setTeams] = React.useState(() => getLocalStorage('pb_teams', buildInitialTeams(6, 9)));
            const [matches, setMatches] = React.useState(() => getLocalStorage('pb_matches', []));
            
            const [selectedGroup, setSelectedGroup] = React.useState('A');
            const [tvScreenMode, setTvScreenMode] = React.useState('A_RANK');
            const [autoRotate, setAutoRotate] = React.useState(true);
            const [toast, setToast] = React.useState(null);

            const [numCourts, setNumCourts] = React.useState(3);
            const [startTime, setStartTime] = React.useState("10:00");
            const [gameDuration, setGameDuration] = React.useState(20);
            const [breakDuration, setBreakDuration] = React.useState(5);

            React.useEffect(() => {
                const handleStorageUpdate = () => {
                    setTeams(getLocalStorage('pb_teams', []));
                    setMatches(getLocalStorage('pb_matches', []));
                    setTournamentType(getLocalStorage('pb_type', 'league'));
                };
                window.addEventListener('storage_update', handleStorageUpdate);
                return () => window.removeEventListener('storage_update', handleStorageUpdate);
            }, []);

            React.useEffect(() => {
                if (!autoRotate) return;
                const interval = setInterval(() => {
                    setTvScreenMode(prev => {
                        if (prev === 'A_RANK') return 'B_RANK';
                        if (prev === 'B_RANK') return 'LIVE_COURT';
                        return 'A_RANK';
                    });
                }, 12000);
                return () => clearInterval(interval);
            }, [autoRotate]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };

            // [수학적 결점 제로] 정통 월드컵 트리 인프라 생성기
            const handleGenerateSchedule = () => {
                if (matches.length > 0 && !confirm("⚠️ 대진표를 다시 짜면 기존 데이터가 초기화됩니다. 생성할까요?")) return;

                setLocalStorage('pb_type', tournamentType);
                setLocalStorage('pb_numTeamsA', numTeamsA);
                setLocalStorage('pb_numTeamsB', numTeamsB);
                setLocalStorage('pb_maxGamesA', maxGamesA);
                setLocalStorage('pb_maxGamesB', maxGamesB);

                const updatedTeams = [];
                for(let i=1; i<=numTeamsA; i++) {
                    const ex = teams.find(t => t.id === `A${i}`);
                    updatedTeams.push(ex || { id: `A${i}`, group: 'A', name: `A${i}팀`, player1: '', player2: '' });
                }
                for(let i=1; i<=numTeamsB; i++) {
                    const ex = teams.find(t => t.id === `B${i}`);
                    updatedTeams.push(ex || { id: `B${i}`, group: 'B', name: `B${i}팀`, player1: '', player2: '' });
                }
                setTeams(updatedTeams);
                setLocalStorage('pb_teams', updatedTeams);

                let allGames = [];

                if (tournamentType === 'league') {
                    const makeLeague = (groupName, groupTeams, limitParam) => {
                        let list = [...groupTeams];
                        if (list.length % 2 !== 0) list.push({ id: 'BYE', name: '부전승' });
                        const rounds = [];
                        const NT = list.length;
                        for (let r = 0; r < NT - 1; r++) {
                            const rGames = [];
                            for (let i = 0; i < NT / 2; i++) {
                                const t1 = list[i]; const t2 = list[NT - 1 - i];
                                if (t1.id !== 'BYE' && t2.id !== 'BYE') {
                                    rGames.push({ group: groupName, team1Id: t1.id, team2Id: t2.id, roundName: `${r+1}R` });
                                }
                            }
                            rounds.push(rGames);
                            list.splice(1, 0, list.pop());
                        }
                        let sliced = [];
                        const finalLimit = Math.min(limitParam, NT - 1);
                        for(let k=0; k<finalLimit; k++) sliced.push(...rounds[k]);
                        return sliced;
                    };
                    allGames.push(...makeLeague('A', updatedTeams.filter(t => t.group === 'A'), maxGamesA));
                    allGames.push(...makeLeague('B', updatedTeams.filter(t => t.group === 'B'), maxGamesB));

                } else {
                    // [수학적 마스터피스] 월드컵 토너먼트 고정 트리 구축 레이어
                    const buildPerfectStaticTree = (groupName, maxCount) => {
                        const mId = (r, idx) => `T_${groupName}_${r}_${idx}`;
                        const tree = [];

                        // 총 슬롯 기반 계산 (8팀 이하면 8강 베이스, 9팀 이상이면 16강 베이스 배정)
                        const is16Block = maxCount > 8;

                        if (is16Block) {
                            // --- [1] 9팀 ~ 16팀용 무결점 구조 (부전승 철저 보호) ---
                            // 1R (예선전) 슬롯 4개 생성
                            // 9팀일 때: 8번 vs 9번 격돌 배치 (나머지 1~7번은 부전승 확정 자동 수송 대기)
                            for(let i=1; i<=4; i++) {
                                const baseSeed = 8 - i + 1; // 8, 7, 6, 5
                                const extraSeed = 8 + i;   // 9, 10, 11, 12
                                const t1 = extraSeed <= maxCount ? `${groupName}${baseSeed}` : "BYE";
                                const t2 = extraSeed <= maxCount ? `${groupName}${extraSeed}` : "BYE";

                                tree.push({
                                    id: mId('1R', i), group: groupName, roundName: '토너먼트 1R',
                                    team1Id: t1, team2Id: t2, nextMatchId: mId('8G', i), nextSlot: 2
                                });
                            }

                            // 8강전 기둥 설치
                            tree.push({ id: mId('8G', 1), group: groupName, roundName: '8강전', team1Id: `${groupName}1`, team2Id: `WAIT_${mId('1R', 1)}`, nextMatchId: mId('4G', 1), nextSlot: 1 });
                            tree.push({ id: mId('8G', 2), group: groupName, roundName: '8강전', team1Id: maxCount>=4?`${groupName}4` : "BYE", team2Id: `WAIT_${mId('1R', 4)}`, nextMatchId: mId('4G', 1), nextSlot: 2 });
                            tree.push({ id: mId('8G', 3), group: groupName, roundName: '8강전', team1Id: maxCount>=2?`${groupName}2` : "BYE", team2Id: `WAIT_${mId('1R', 2)}`, nextMatchId: mId('4G', 2), nextSlot: 1 });
                            tree.push({ id: mId('8G', 4), group: groupName, roundName: '8강전', team1Id: maxCount>=3?`${groupName}3` : "BYE", team2Id: `WAIT_${mId('1R', 3)}`, nextMatchId: mId('4G', 2), nextSlot: 2 });

                        } else {
                            // --- [2] 2팀 ~ 8팀용 8강/4강 프리패스 구조 (1R 예선 기둥 증발!) ---
                            // 8강전 기둥 직행 설치
                            tree.push({ id: mId('8G', 1), group: groupName, roundName: '8강전', team1Id: `${groupName}1`, team2Id: maxCount>=8?`${groupName}8` : "BYE", nextMatchId: mId('4G', 1), nextSlot: 1 });
                            tree.push({ id: mId('8G', 2), group: groupName, roundName: '8강전', team1Id: maxCount>=4?`${groupName}4` : (maxCount>=5?`${groupName}5` : "BYE"), team2Id: "BYE", nextMatchId: mId('4G', 1), nextSlot: 2 });
                            tree.push({ id: mId('8G', 3), group: groupName, roundName: '8강전', team1Id: maxCount>=2?`${groupName}2` : (maxCount>=7?`${groupName}7` : "BYE"), team2Id: "BYE", nextMatchId: mId('4G', 2), nextSlot: 1 });
                            tree.push({ id: mId('8G', 4), group: groupName, roundName: '8강전', team1Id: maxCount>=3?`${groupName}3` : (maxCount>=6?`${groupName}6` : "BYE"), team2Id: "BYE", nextMatchId: mId('4G', 2), nextSlot: 2 });
                        }

                        // 공통 4강 준결승 기둥 안착
                        tree.push({ id: mId('4G', 1), group: groupName, roundName: '🏅 4강 준결승', team1Id: `WAIT_${mId('8G', 1)}`, team2Id: `WAIT_${mId('8G', 2)}`, nextMatchId: mId('FI', 1), nextSlot: 1 });
                        tree.push({ id: mId('4G', 2), group: groupName, roundName: '🏅 4강 준결승', team1Id: `WAIT_${mId('8G', 3)}`, team2Id: `WAIT_${mId('8G', 4)}`, nextMatchId: mId('FI', 1), nextSlot: 2 });

                        // 공통 결승전 기둥 안착
                        tree.push({ id: mId('FI', 1), group: groupName, roundName: '🥇 최종 결승전', team1Id: `WAIT_${mId('4G', 1)}`, team2Id: `WAIT_${mId('4G', 2)}`, nextMatchId: null });

                        // 부전승(BYE) 자동 수송 시뮬레이션 필터 4회 연속 가동
                        let cascade = [...tree];
                        for (let loop = 0; loop < 4; loop++) {
                            cascade = cascade.map(m => {
                                if ((m.team1Id === "BYE" || m.team2Id === "BYE") && !m.completed) {
                                    const realWinner = m.team1Id === "BYE" ? m.team2Id : m.team1Id;
                                    // 윗자리로 승자 배달
                                    return { ...m, score1: m.team1Id==="BYE"?0:11, score2: m.team2Id==="BYE"?0:11, completed: true };
                                }
                                return m;
                            });

                            cascade = cascade.map(m => {
                                let node = { ...m };
                                cascade.forEach(src => {
                                    if (src.completed) {
                                        const winId = src.score1 > src.score2 ? src.team1Id : src.team2Id;
                                        if (node.team1Id === `WAIT_${src.id}`) node.team1Id = winId;
                                        if (node.team2Id === `WAIT_${src.id}`) node.team2Id = winId;
                                    }
                                });
                                return node;
                            });
                        }
                        return cascade;
                    };

                    allGames.push(...buildPerfectStaticTree('A', numTeamsA));
                    allGames.push(...buildPerfectStaticTree('B', numTeamsB));
                }

                // 스케줄러 배정
                let currentMin = (() => {
                    const [h, m] = startTime.split(':').map(Number);
                    return h * 60 + m;
                })();

                let courtIdx = 1;
                const scheduled = allGames.map((g) => {
                    if (g.completed || g.team1Id === "BYE" || g.team2Id === "BYE" || g.team1Id === "BYE팀" || g.team2Id === "BYE팀") {
                        return { ...g, completed: true, score1: g.score1||0, score2: g.score2||0 };
                    }

                    const h = String(Math.floor(currentMin / 60) % 24).padStart(2, '0');
                    const m = String(currentMin % 60).padStart(2, '0');
                    const matchTime = `${h}:${m}`;
                    const courtName = `${courtIdx}코트`;

                    courtIdx++;
                    if (courtIdx > numCourts) {
                        courtIdx = 1;
                        currentMin += (Number(gameDuration) + Number(breakDuration));
                    }
                    return { ...g, time: matchTime, court: courtName };
                });

                setMatches(scheduled);
                setLocalStorage('pb_matches', scheduled);
                showToast("🏆 완벽 계산된 월드컵 토너먼트 대진 트리가 빌드되었습니다!");
            };

            const saveScore = (matchId, s1, s2, completed) => {
                let updated = matches.map(m => m.id === matchId ? { ...m, score1: s1, score2: s2, completed } : m);
                
                if (completed && tournamentType === 'tournament') {
                    const target = updated.find(m => m.id === matchId);
                    const winnerId = s1 > s2 ? target.team1Id : target.team2Id;
                    
                    if (target.nextMatchId) {
                        updated = updated.map(m => {
                            if (m.id === target.nextMatchId) {
                                if (target.nextSlot === 1) return { ...m, team1Id: winnerId };
                                if (target.nextSlot === 2) return { ...m, team2Id: winnerId };
                            }
                            return m;
                        });
                    }
                }
                setMatches(updated);
                setLocalStorage('pb_matches', updated);
                if (completed) showToast("🏆 점수가 확정되어 대진 트리가 전진했습니다!");
            };

            const updateTeamPlayers = (teamId, p1, p2) => {
                const updated = teams.map(t => t.id === teamId ? { ...t, player1: p1, player2: p2 } : t);
                setTeams(updated);
                setLocalStorage('pb_teams', updated);
                showToast("👤 명단 정보 업데이트 완료!");
            };

            const getRankings = (groupName) => {
                const groupTeams = teams.filter(t => t.group === groupName);
                const groupMatches = matches.filter(m => m.group === groupName && m.completed && m.team1Id!=="BYE" && m.team2Id!=="BYE");

                const stats = {};
                groupTeams.forEach(t => {
                    stats[t.id] = { id: t.id, name: t.name, p1: t.player1, p2: t.player2, wins: 0, losses: 0, pf: 0, pa: 0, played: 0 };
                });

                groupMatches.forEach(m => {
                    const t1 = stats[m.team1Id]; const t2 = stats[m.team2Id];
                    if (t1 && t2) {
                        t1.played++; t2.played++;
                        t1.pf += m.score1; t1.pa += m.score2;
                        t2.pf += m.score2; t2.pa += m.score1;
                        if (m.score1 > m.score2) { t1.wins++; t2.losses++; }
                        else { t2.wins++; t1.losses++; }
                    }
                });

                return Object.values(stats).sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    const diffA = a.pf - a.pa; const diffB = b.pf - b.pa;
                    if (diffB !== diffA) return diffB - diffA;
                    return b.pf - a.pf;
                });
            };

            const displayGroup = tvScreenMode === 'B_RANK' ? 'B' : 'A';
            const currentRankings = getRankings(displayGroup);

            const finalMatchNode = matches.find(m => m.group === displayGroup && m.roundName === "🥇 최종 결승전");
            const isTournamentFinished = finalMatchNode && finalMatchNode.completed && !finalMatchNode.team1Id.startsWith('WAIT_') && !finalMatchNode.team2Id.startsWith('WAIT_');

            const getTournamentPodium = () => {
                if(!finalMatchNode || !finalMatchNode.completed) return null;
                const champId = finalMatchNode.score1 > finalMatchNode.score2 ? finalMatchNode.team1Id : finalMatchNode.team2Id;
                const runnerId = finalMatchNode.score1 > finalMatchNode.score2 ? finalMatchNode.team2Id : finalMatchNode.team1Id;
                
                const semiMatches = matches.filter(m => m.group === displayGroup && m.roundName === "🏅 4강 준결승");
                const thirds = semiMatches.map(m => m.score1 > m.score2 ? m.team2Id : m.team1Id);

                const getTeamObj = (id) => teams.find(t => t.id === id) || { name: id, player1: '', player2: '' };
                return { champ: getTeamObj(champId), runner: getTeamObj(runnerId), thirds: thirds.map(id => getTeamObj(id)) };
            };
            const tournamentPodium = getTournamentPodium();

            return (
                <div className="min-h-screen bg-slate-950 text-white flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl">🏆</span>
                            <div>
                                <h1 className="text-xl font-black text-yellow-400 tracking-wider">CHURCH PICKLEBALL STADIUM</h1>
                                <p className="text-xs text-slate-400">교회 연합 피클볼 대회 전광판 라이브 시스템</p>
                            </div>
                        </div>
                        <nav className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-sm font-bold">
                            <button onClick={() => setActiveTab('tv')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'tv' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>📺 대형 TV 전광판</button>
                            <button onClick={() => setActiveTab('admin')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'admin' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>📱 iPhone 입력</button>
                            <button onClick={() => setActiveTab('teams')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'teams' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>👥 선수 명단</button>
                            <button onClick={() => setActiveTab('schedule')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'schedule' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>⚙️ 대진표 세팅</button>
                        </nav>
                    </header>

                    <main className="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
                        {activeTab === 'tv' && (
                          <div className="space-y-6">
                            <div className="flex flex-wrap justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 gap-2">
                                <div className="flex gap-2">
                                    <button onClick={() => { setTvScreenMode('A_RANK'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvScreenMode === 'A_RANK' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>{tournamentType==='league'?'A조 순위표':'A조 월드컵 트리'}</button>
                                    <button onClick={() => { setTvScreenMode('B_RANK'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvScreenMode === 'B_RANK' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>{tournamentType==='league'?'B조 순위표':'B조 월드컵 트리'}</button>
                                    <button onClick={() => { setTvScreenMode('LIVE_COURT'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvScreenMode === 'LIVE_COURT' ? 'bg-emerald-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>🕒 실시간 코트현황</button>
                                </div>
                                <button onClick={() => setAutoRotate(!autoRotate)} className={`text-xs px-3 py-1.5 rounded-lg font-bold border ${autoRotate ? 'border-yellow-400/50 text-yellow-400' : 'border-slate-700 text-slate-500'}`}>
                                    {autoRotate ? '🔄 자동 화면순환 작동중 (12초 주기)' : '⏸️ 순환 일시중지'}
                                </button>
                            </div>

                            {/* [토너먼트 완료 피날레 세리머니 스크린] */}
                            {tournamentType === 'tournament' && isTournamentFinished && tournamentPodium && (tvScreenMode === 'A_RANK' || tvScreenMode === 'B_RANK') ? (
                                <div className="bg-slate-900 border-4 border-yellow-400 p-8 rounded-3xl text-center space-y-12 relative overflow-hidden py-20 shadow-2xl">
                                    <div className="space-y-4 relative z-10">
                                        <span className="text-7xl block glow-effect">🏆✨👑✨🏆</span>
                                        <h2 className="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-200 to-yellow-500 tracking-tight pt-4">FINAL CHAMPION CELEBRATION</h2>
                                        <p className="text-sm font-bold text-slate-400 tracking-widest uppercase">영광의 피클볼 대회 최종 순위 발표</p>
                                    </div>

                                    {/* 차등 계단식 포디움 시상대 */}
                                    <div className="flex flex-col md:flex-row justify-center items-end gap-6 max-w-4xl mx-auto pt-12 relative z-10">
                                        {/* 🥈 준우승 (2등) */}
                                        <div className="w-full md:w-64 bg-slate-950 border-2 border-slate-700 p-6 rounded-2xl h-[220px] flex flex-col justify-between border-b-8 border-b-slate-400">
                                            <span className="text-xs font-black text-slate-400 block">🥈 RUNNER-UP (준우승)</span>
                                            <div className="py-2"><h4 className="text-2xl font-black text-white">{tournamentPodium.runner.name}</h4><p className="text-xs text-slate-400 font-bold mt-1">{tournamentPodium.runner.player1} & {tournamentPodium.runner.player2}</p></div>
                                            <div className="text-[11px] font-bold text-slate-500">최종 2위</div>
                                        </div>

                                        {/* 🏆 최종 우승 (1등) */}

                                                    <div className="flex justify-between items-center text-xs font-bold text-slate-400 border-b border-slate-800 pb-2">
                                                        <span>⏰ {m.time || '대기'} ({m.roundName})</span>
                                                        <span className="bg-slate-950 text-yellow-400 px-2 py-0.5 rounded">{m.court || '코트 대기'}</span>
                                                        <span className={m.completed ? 'text-emerald-400' : 'text-amber-400'}>{m.completed ? '● 확정됨' : '○ 진행중'}</span>
                                                    </div>
                                                    <div className="grid grid-cols-7 items-center text-center">
                                                        <div className="col-span-3 space-y-1">
                                                            <div className="text-xs text-slate-500 font-black">{m.team1Id}</div>
                                                            <div className="font-bold text-sm text-white truncate">{isT1Wait ? '❔ 앞경기 승자 대기팀' : t1?.name}</div>
                                                            <div className="text-[11px] text-slate-400 bg-slate-950/40 py-0.5 rounded px-1 truncate">
                                                                {t1 && (t1.player1 || t1.player2) ? `${t1.player1}, ${t1.player2}` : '선수 미지정'}
                                                            </div>
                                                            <div className="flex flex-col items-center gap-1.5 pt-2">
                                                                <div className="flex items-center justify-center gap-1">
                                                                    <button disabled={isT1Wait} onClick={() => saveScore(m.id, Math.max(0, s1 - 1), s2, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm disabled:opacity-20">-</button>
                                                                    <input type="number" disabled={isT1Wait} value={m.score1 !== null ? m.score1 : ''} placeholder="0" onChange={(e) => saveScore(m.id, e.target.value === '' ? null : Number(e.target.value), m.score2, false)} className="w-12 h-8 bg-slate-950 border border-slate-800 rounded-lg text-center font-black text-base text-yellow-400 disabled:opacity-20" />
                                                                    <button disabled={isT1Wait} onClick={() => saveScore(m.id, s1 + 1, s2, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm disabled:opacity-20">+</button>
                                                                </div>
                                                                <button disabled={isT1Wait} onClick={() => saveScore(m.id, 11, s2, false)} className="px-2.5 py-0.5 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 rounded-md text-[11px] font-black disabled:opacity-20">👑 11점 세팅</button>
                                                            </div>
                                                        </div>

                                                        <div className="col-span-1 text-xs font-black text-slate-600">VS</div>

                                                        <div className="col-span-3 space-y-1">
                                                            <div className="text-xs text-slate-500 font-black">{m.team2Id}</div>
                                                            <div className="font-bold text-sm text-white truncate">{isT2Wait ? '❔ 승자 대기팀' : t2?.name}</div>
                                                            <div className="text-[11px] text-slate-400 bg-slate-950/40 py-0.5 rounded px-1 truncate">
                                                                {t2 && (t2.player1 || t2.player2) ? `${t2.player1}, ${t2.player2}` : '선수 미지정'}
                                                            </div>
                                                            <div className="flex flex-col items-center gap-1.5 pt-2">
                                                                <div className="flex items-center justify-center gap-1">
                                                                    <button disabled={isT2Wait} onClick={() => saveScore(m.id, s1, Math.max(0, s2 - 1), false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm disabled:opacity-20">-</button>
                                                                    <input type="number" disabled={isT2Wait} value={m.score2 !== null ? m.score2 : ''} placeholder="0" onChange={(e) => saveScore(m.id, m.score1, e.target.value === '' ? null : Number(e.target.value), false)} className="w-12 h-8 bg-slate-950 border border-slate-800 rounded-lg text-center font-black text-base text-yellow-400 disabled:opacity-20" />
                                                                    <button disabled={isT2Wait} onClick={() => saveScore(m.id, s1, s2 + 1, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm disabled:opacity-20">+</button>
                                                                </div>
                                                                <button disabled={isT2Wait} onClick={() => saveScore(m.id, s1, 11, false)} className="px-2.5 py-0.5 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 rounded-md text-[11px] font-black disabled:opacity-20">👑 11점 세팅</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="pt-2 border-t border-slate-800/50">
                                                        {m.completed ? (
                                                            <button onClick={() => saveScore(m.id, m.score1, m.score2, false)} className="w-full py-1.5 bg-slate-950 text-slate-400 text-xs font-bold rounded-xl border border-slate-800">🔓 결과 잠금해제 및 재수정</button>
                                                        ) : (
                                                            <button 
                                                                disabled={isT1Wait || isT2Wait}
                                                                onClick={() => {
                                                                    if (s1 < 11 && s2 < 11) {
                                                                        alert("⚠️ 피클볼 스코어 마감 가드!\n최소 한 팀은 11점 이상 획득해야 마감 가능합니다.");
                                                                        return;
                                                                    }
                                                                    saveScore(m.id, s1, s2, true);
                                                                }} 
                                                                className="w-full py-2 bg-emerald-500 text-slate-950 text-xs font-black rounded-xl shadow-lg disabled:opacity-20"
                                                            >
                                                                {isT1Wait || isT2Wait ? '이전 라운드 진행 대기중...' : '경기 결과 마감 및 잠금 🔒'}
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 3. 명단 편집 */}
                        {activeTab === 'teams' && (
                            <div className="max-w-2xl mx-auto space-y-4">
                                <div className="flex gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                                    <button onClick={() => setSelectedGroup('A')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'A' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>A조 명단 수정 ({numTeamsA}팀)</button>
                                    <button onClick={() => setSelectedGroup('B')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'B' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>B조 명단 수정 ({numTeamsB}팀)</button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {teams.filter(t => t.group === selectedGroup).map(t => (
                                        <div key={t.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                                            <div className="flex items-center gap-2"><span className="text-xs bg-slate-950 px-2 py-0.5 rounded text-yellow-400 font-black">{t.id}</span><span className="font-bold text-sm">{t.name}</span></div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="text" value={t.player1} onChange={(e) => updateTeamPlayers(t.id, e.target.value, t.player2)} className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-white focus:border-yellow-400 focus:outline-none" placeholder="선수 1 이름"/>
                                                <input type="text" value={t.player2} onChange={(e) => updateTeamPlayers(t.id, t.player1, e.target.value)} className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-white focus:border-yellow-400 focus:outline-none" placeholder="선수 2 이름"/>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. 대진표 세팅 */}
                        {activeTab === 'schedule' && (
                            <div className="max-w-xl mx-auto space-y-6">
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-6 shadow-xl">
                                    <div className="text-center">
                                        <h3 className="text-lg font-black text-white">⚙️ 스마트 경기 시스템 환경설정</h3>
                                        <p className="text-[11px] text-slate-400">대회 방식 및 참가 팀 수를 제어합니다.</p>
                                    </div>
                                    
                                    <div className="border-t border-slate-800 pt-4 space-y-5">
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-400 uppercase block">🏆 대회 대진 시스템 방식 선택</label>
                                            <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-2xl border border-slate-800">
                                                <button onClick={() => setTournamentType('league')} className={`py-3 rounded-xl font-black text-sm transition-all ${tournamentType === 'league' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>
                                                    풀 리그전 모드 (League)
                                                </button>
                                                <button onClick={() => setTournamentType('tournament')} className={`py-3 rounded-xl font-black text-sm transition-all ${tournamentType === 'tournament' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>
                                                    단판 토너먼트 모드 (Tournament)
                                                </button>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase">🅰️ A조 경기 세팅</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">A조 참여 팀수</label>
                                                    <input type="number" min="2" max="30" value={numTeamsA} onChange={(e) => setNumTeamsA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">팀당 제한 매치수 (리그용)</label>
                                                    <input type="number" disabled={tournamentType==='tournament'} min="1" max={numTeamsA} value={maxGamesA} onChange={(e) => setMaxGamesA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold disabled:opacity-20" />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase">🅱️ B조 경기 세팅</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">B조 참여 팀수</label>
                                                    <input type="number" min="2" max="30" value={numTeamsB} onChange={(e) => setNumTeamsB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">팀당 제한 매치수 (리그용)</label>
                                                    <input type="number" disabled={tournamentType==='tournament'} min="1" max={numTeamsB} value={maxGamesB} onChange={(e) => setMaxGamesB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold disabled:opacity-20" />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3 text-xs font-bold text-slate-400">
                                            <div className="space-y-1 col-span-2">
                                                <label>체육관 활성 코트 수</label>
                                                <select value={numCourts} onChange={(e) => setNumCourts(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white">
                                                    <option value={1}>1개 코트 운영</option>
                                                    <option value={2}>2개 코트 배치</option>
                                                    <option value={3}>3개 코트 가동</option>
                                                    <option value={4}>4개 코트 가동</option>
                                                </select>
                                            </div>
                                            <div className="space-y-1">
                                                <label>대회 첫경기 시작시간</label>
                                                <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-white text-center font-bold"/>
                                            </div>
                                            <div className="space-y-1">
                                                <label>경기 간격 주기 (분)</label>
                                                <input type="number" value={gameDuration} onChange={(e) => setGameDuration(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-white text-center"/>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={handleGenerateSchedule} className="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black rounded-2xl text-sm shadow-xl transition-all">
                                        🚀 최적화 맞춤 대진 스케줄 자동 빌드하기
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
