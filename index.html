<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교회 피클볼 대회 실시간 전광판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white">
    <div id="root"></div>

    <script type="text/babel">
        // --- 로컬 스토리지 연동 엔진 ---
        const getLocalStorage = (key, defaultVal) => {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : defaultVal;
        };
        const setLocalStorage = (key, val) => {
            localStorage.setItem(key, JSON.stringify(val));
            window.dispatchEvent(new Event('storage_update'));
        };

        const initialTeams = [
            // A조
            { id: 'A1', group: 'A', name: 'A1팀', player1: '홍길동', player2: '김철수' },
            { id: 'A2', group: 'A', name: 'A2팀', player1: '이영희', player2: '박민수' },
            { id: 'A3', group: 'A', name: 'A3팀', player1: '최수민', player2: '정다은' },
            { id: 'A4', group: 'A', name: 'A4팀', player1: '강호동', player2: '유재석' },
            { id: 'A5', group: 'A', name: 'A5팀', player1: '신동엽', player2: '이수근' },
            { id: 'A6', group: 'A', name: 'A6팀', player1: '김종국', player2: '송지효' },
            // B조
            { id: 'B1', group: 'B', name: 'B1팀', player1: '집사A', player2: '집사B' },
            { id: 'B2', group: 'B', name: 'B2팀', player1: '권사A', player2: '권사B' },
            { id: 'B3', group: 'B', name: 'B3팀', player1: '장로A', player2: '장로B' },
            { id: 'B4', group: 'B', name: 'B4팀', player1: '청년A', player2: '청년B' },
            { id: 'B5', group: 'B', name: 'B5팀', player1: '성도A', player2: '성도B' },
            { id: 'B6', group: 'B', name: 'B6팀', player1: '성도C', player2: '성도D' },
            { id: 'B7', group: 'B', name: 'B7팀', player1: '목사A', player2: '전도사B' },
            { id: 'B8', group: 'B', name: 'B8팀', player1: '교사A', player2: '교사B' },
            { id: 'B9', group: 'B', name: 'B9팀', player1: '학생A', player2: '학생B' },
            { id: 'B10', group: 'B', name: 'B10팀', player1: '새신자A', player2: '새신자B' },
        ];

        function App() {
            const [activeTab, setActiveTab] = React.useState('tv');
            const [teams, setTeams] = React.useState(() => getLocalStorage('pb_teams', initialTeams));
            const [matches, setMatches] = React.useState(() => getLocalStorage('pb_matches', []));
            const [selectedGroup, setSelectedGroup] = React.useState('A');
            const [tvGroup, setTvGroup] = React.useState('A');
            const [autoRotate, setAutoRotate] = React.useState(true);
            const [toast, setToast] = React.useState(null);

            const [numCourts, setNumCourts] = React.useState(3);
            const [startTime, setStartTime] = React.useState("10:00");
            const [gameDuration, setGameDuration] = React.useState(20);
            const [breakDuration, setBreakDuration] = React.useState(5);

            React.useEffect(() => {
                const handleStorageUpdate = () => {
                    setTeams(getLocalStorage('pb_teams', initialTeams));
                    setMatches(getLocalStorage('pb_matches', []));
                };
                window.addEventListener('storage_update', handleStorageUpdate);
                return () => window.removeEventListener('storage_update', handleStorageUpdate);
            }, []);

            React.useEffect(() => {
                if (!autoRotate) return;
                const interval = setInterval(() => {
                    setTvGroup(prev => prev === 'A' ? 'B' : 'A');
                }, 10000);
                return () => clearInterval(interval);
            }, [autoRotate]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };

            const generateSchedule = () => {
                if (matches.length > 0 && !confirm("이미 만들어진 대진표와 점수가 싹 지워집니다. 다시 짜시겠습니까?")) return;

                const makeRoundRobin = (groupName, groupTeams) => {
                    let list = [...groupTeams];
                    if (list.length % 2 !== 0) list.push({ id: 'BYE', name: '쉬는팀' });
                    const rounds = [];
                    const numTeams = list.length;
                    for (let r = 0; r < numTeams - 1; r++) {
                        for (let i = 0; i < numTeams / 2; i++) {
                            const t1 = list[i];
                            const t2 = list[numTeams - 1 - i];
                            if (t1.id !== 'BYE' && t2.id !== 'BYE') {
                                rounds.push({ group: groupName, team1Id: t1.id, team2Id: t2.id });
                            }
                        }
                        list.splice(1, 0, list.pop());
                    }
                    return rounds;
                };

                const gamesA = makeRoundRobin('A', teams.filter(t => t.group === 'A'));
                const gamesB = makeRoundRobin('B', teams.filter(t => t.group === 'B'));
                let allGames = [...gamesA, ...gamesB];

                let currentMin = (() => {
                    const [h, m] = startTime.split(':').map(Number);
                    return h * 60 + m;
                })();

                let courtIdx = 1;
                const finalMatches = allGames.map((g, idx) => {
                    const h = String(Math.floor(currentMin / 60) % 24).padStart(2, '0');
                    const m = String(currentMin % 60).padStart(2, '0');
                    const matchTime = `${h}:${m}`;
                    const courtName = `${courtIdx}코트`;

                    courtIdx++;
                    if (courtIdx > numCourts) {
                        courtIdx = 1;
                        currentMin += (Number(gameDuration) + Number(breakDuration));
                    }

                    return {
                        id: `match_${idx + 1}`,
                        ...g,
                        score1: null,
                        score2: null,
                        completed: false,
                        time: matchTime,
                        court: courtName
                    };
                });

                setMatches(finalMatches);
                setLocalStorage('pb_matches', finalMatches);
                showToast("⚡ 스마트 자동 대진표가 구성되었습니다!");
            };

            const saveScore = (matchId, s1, s2, completed) => {
                const updated = matches.map(m => m.id === matchId ? { ...m, score1: s1, score2: s2, completed } : m);
                setMatches(updated);
                setLocalStorage('pb_matches', updated);
                if (completed) showToast("🏆 경기가 종료되어 랭킹에 반영되었습니다!");
            };

            const updateTeamPlayers = (teamId, p1, p2) => {
                const updated = teams.map(t => t.id === teamId ? { ...t, player1: p1, player2: p2 } : t);
                setTeams(updated);
                setLocalStorage('pb_teams', updated);
                showToast("👤 선수 명단이 업데이트되었습니다.");
            };

            const getRankings = (groupName) => {
                const groupTeams = teams.filter(t => t.group === groupName);
                const groupMatches = matches.filter(m => m.group === groupName && m.completed);

                const stats = {};
                groupTeams.forEach(t => {
                    stats[t.id] = { id: t.id, name: t.name, p1: t.player1, p2: t.player2, wins: 0, losses: 0, pf: 0, pa: 0, played: 0 };
                });

                groupMatches.forEach(m => {
                    const t1 = stats[m.team1Id];
                    const t2 = stats[m.team2Id];
                    if (t1 && t2) {
                        t1.played++; t2.played++;
                        t1.pf += m.score1; t1.pa += m.score2;
                        t2.pf += m.score2; t2.pa += m.score1;
                        if (m.score1 > m.score2) { t1.wins++; t2.losses++; }
                        else { t2.wins++; t1.losses++; }
                    }
                });

                return Object.values(stats).sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    const diffA = a.pf - a.pa;
                    const diffB = b.pf - b.pa;
                    if (diffB !== diffA) return diffB - diffA;
                    return b.pf - a.pf;
                });
            };

            const currentRankings = getRankings(tvGroup);

            return (
                <div className="min-h-screen bg-slate-950 text-white flex flex-col">
                    {toast && (
                        <div className="fixed top-5 right-5 bg-emerald-500 text-slate-950 font-black px-6 py-3 rounded-2xl shadow-2xl z-50 animate-bounce">
                            {toast}
                        </div>
                    )}

                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl">🏆</span>
                            <div>
                                <h1 className="text-xl font-black text-yellow-400 tracking-wider">CHURCH PICKLEBALL LIVE</h1>
                                <p className="text-xs text-slate-400">교회 연합 피클볼 대회 실시간 전광판 시스템</p>
                            </div>
                        </div>
                        <nav className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-sm font-bold">
                            <button onClick={() => setActiveTab('tv')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'tv' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>📺 TV 전광판</button>
                            <button onClick={() => setActiveTab('admin')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'admin' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>📱 모바일 입력</button>
                            <button onClick={() => setActiveTab('teams')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'teams' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>👤 선수 등록</button>
                            <button onClick={() => setActiveTab('schedule')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'schedule' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>📅 대진표 구성</button>
                        </nav>
                    </header>

                    <main className="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
                        
                        {/* 1. TV 전광판 뷰 */}
                        {activeTab === 'tv' && (
                          <div className="space-y-6">
                            <div className="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                <div className="flex gap-2">
                                    <button onClick={() => { setTvGroup('A'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvGroup === 'A' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>A조 보기</button>
                                    <button onClick={() => { setTvGroup('B'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvGroup === 'B' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>B조 보기</button>
                                </div>
                                <button onClick={() => setAutoRotate(!autoRotate)} className={`text-xs px-3 py-1.5 rounded-lg font-bold border ${autoRotate ? 'border-yellow-400/50 text-yellow-400' : 'border-slate-700 text-slate-500'}`}>
                                    🔄 10초 자동 조 전환: {autoRotate ? 'ON' : 'OFF'}
                                </button>
                            </div>

                            <div className="text-center py-6 bg-gradient-to-r from-yellow-400/5 via-slate-900 to-yellow-400/5 rounded-3xl border border-slate-800">
                                <span className="bg-yellow-400 text-slate-950 text-xs font-black px-3 py-1 rounded-full uppercase tracking-widest">{tvGroup}조 실시간 순위</span>
                                <h2 className="text-3xl md:text-5xl font-black mt-2 tracking-tight">STANDINGS - GROUP {tvGroup}</h2>
                            </div>

                            {currentRankings.length === 0 ? (
                                <div className="text-center py-20 bg-slate-900 rounded-3xl text-slate-500 font-bold">
                                    아직 진행된 경기 결과가 없습니다. 대진표를 먼저 짜고 점수를 입력해 주세요!
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                                        {/* 2위 */}
                                        {currentRankings[1] && (
                                            <div className="bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 h-64 flex flex-col justify-between shadow-xl order-2 md:order-1">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-xs font-black text-slate-400 uppercase tracking-widest">2ND PLACE</span>
                                                    <span className="text-2xl">🥈</span>
                                                </div>
                                                <div>
                                                    <div className="text-xs text-slate-500 font-black">{currentRankings[1].id}</div>
                                                    <h3 className="text-xl font-black text-white">{currentRankings[1].name}</h3>
                                                    <p className="text-xs text-slate-400">{currentRankings[1].p1} & {currentRankings[1].p2}</p>
                                                </div>
                                                <div className="border-t border-slate-800 pt-3 grid grid-cols-3 text-center text-xs font-bold">
                                                    <div><p className="text-slate-500">전적</p><p className="text-sm font-black text-white">{currentRankings[1].wins}승 {currentRankings[1].losses}패</p></div>
                                                    <div><p className="text-slate-500">득실차</p><p className="text-sm font-black text-amber-500">{currentRankings[1].pf - currentRankings[1].pa}</p></div>
                                                    <div><p className="text-slate-500">득점</p><p className="text-sm font-black text-white">{currentRankings[1].pf}점</p></div>
                                                </div>
                                            </div>
                                        )}
                                        {/* 1위 */}
                                        {currentRankings[0] && (
                                            <div className="bg-slate-900 border-2 border-yellow-400 rounded-3xl p-6 h-72 flex flex-col justify-between shadow-2xl shadow-yellow-400/5 order-1 md:order-2">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-xs font-black text-yellow-400 uppercase tracking-widest">1ST PLACE</span>
                                                    <span className="text-3xl">🏆</span>
                                                </div>
                                                <div>
                                                    <div className="text-xs text-yellow-400/70 font-black">{currentRankings[0].id}</div>
                                                    <h3 className="text-2xl font-black text-white">{currentRankings[0].name}</h3>
                                                    <p className="text-xs text-slate-300">{currentRankings[0].p1} & {currentRankings[0].p2}</p>
                                                </div>
                                                <div className="border-t border-yellow-400/20 pt-3 grid grid-cols-3 text-center text-xs font-bold">
                                                    <div><p className="text-yellow-400/60">전적</p><p className="text-base font-black text-yellow-400">{currentRankings[0].wins}승 {currentRankings[0].losses}패</p></div>
                                                    <div><p className="text-yellow-400/60">득실차</p><p className="text-base font-black text-amber-500">{currentRankings[0].pf - currentRankings[0].pa}</p></div>
                                                    <div><p className="text-yellow-400/60">득점</p><p className="text-base font-black text-white">{currentRankings[0].pf}점</p></div>
                                                </div>
                                            </div>
                                        )}
                                        {/* 3위 */}
                                        {currentRankings[2] && (
                                            <div className="bg-slate-900 border-2 border-amber-800 rounded-3xl p-6 h-64 flex flex-col justify-between shadow-xl order-3">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-xs font-black text-amber-600 uppercase tracking-widest">3RD PLACE</span>
                                                    <span className="text-2xl">🥉</span>
                                                </div>
                                                <div>
                                                    <div className="text-xs text-slate-500 font-black">{currentRankings[2].id}</div>
                                                    <h3 className="text-xl font-black text-white">{currentRankings[2].name}</h3>
                                                    <p className="text-xs text-slate-400">{currentRankings[2].p1} & {currentRankings[2].p2}</p>
                                                </div>
                                                <div className="border-t border-slate-800 pt-3 grid grid-cols-3 text-center text-xs font-bold">
                                                    <div><p className="text-slate-500">전적</p><p className="text-sm font-black text-white">{currentRankings[2].wins}승 {currentRankings[2].losses}패</p></div>
                                                    <div><p className="text-slate-500">득실차</p><p className="text-sm font-black text-amber-500">{currentRankings[2].pf - currentRankings[2].pa}</p></div>
                                                    <div><p className="text-slate-500">득점</p><p className="text-sm font-black text-white">{currentRankings[2].pf}점</p></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-950 text-slate-400 text-xs font-bold uppercase border-b border-slate-800">
                                                    <th className="p-4 text-center">순위</th>
                                                    <th className="p-4">팀코드 / 팀명</th>
                                                    <th className="p-4">선수 조합</th>
                                                    <th className="p-4 text-center">경기수</th>
                                                    <th className="p-4 text-center text-emerald-400">승</th>
                                                    <th className="p-4 text-center text-rose-400">패</th>
                                                    <th className="p-4 text-center text-amber-500">득실차</th>
                                                    <th className="p-4 text-center">총득점</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/50 text-sm">
                                                {currentRankings.slice(3).map((t, idx) => (
                                                    <tr key={t.id} className="hover:bg-slate-800/20">
                                                        <td className="p-4 text-center font-black text-slate-400">{idx + 4}위</td>
                                                        <td className="p-4 font-bold text-white"><span className="text-xs bg-slate-950 px-2 py-0.5 rounded text-slate-400 mr-2">{t.id}</span>{t.name}</td>
                                                        <td className="p-4 text-slate-300">{t.p1} & {t.p2}</td>
                                                        <td className="p-4 text-center text-slate-400 font-bold">{t.played}</td>
                                                        <td className="p-4 text-center font-black text-emerald-400">{t.wins}</td>
                                                        <td className="p-4 text-center font-black text-rose-400">{t.losses}</td>
                                                        <td className="p-4 text-center font-black text-amber-500">{(t.pf-t.pa) > 0 ? `+${t.pf-t.pa}` : t.pf-t.pa}</td>
                                                        <td className="p-4 text-center font-black text-slate-200">{t.pf}점</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                          </div>
                        )}

                        {/* 2. 모바일 입력 뷰 */}
                        {activeTab === 'admin' && (
                            <div className="max-w-xl mx-auto space-y-4">
                                <div className="flex gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                                    <button onClick={() => setSelectedGroup('A')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'A' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>A조 매치목록</button>
                                    <button onClick={() => setSelectedGroup('B')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'B' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>B조 매치목록</button>
                                </div>

                                {matches.filter(m => m.group === selectedGroup).length === 0 ? (
                                    <div className="text-center py-10 text-slate-500 font-bold">등록된 경기가 없습니다. 대진표를 먼저 구성해주세요.</div>
                                ) : (
                                    <div className="space-y-4">
                                        {matches.filter(m => m.group === selectedGroup).map(m => {
                                            const t1 = teams.find(t => t.id === m.team1Id);
                                            const t2 = teams.find(t => t.id === m.team2Id);
                                            const s1 = m.score1 !== null ? m.score1 : 0;
                                            const s2 = m.score2 !== null ? m.score2 : 0;

                                            return (
                                                <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                                                    <div className="flex justify-between items-center text-xs font-bold text-slate-400 border-b border-slate-800 pb-2">
                                                        <span>⏰ {m.time}</span>
                                                        <span className="bg-slate-950 text-yellow-400 px-2 py-0.5 rounded">{m.court}</span>
                                                        <span className={m.completed ? 'text-emerald-400' : 'text-amber-400'}>{m.completed ? '● 종료됨' : '○ 진행중'}</span>
                                                    </div>
                                                    <div className="grid grid-cols-7 items-center text-center">
                                                        {/* 팀 1 */}
                                                        <div className="col-span-3 space-y-1">
                                                            <div className="text-xs text-slate-500 font-black">{m.team1Id}</div>
                                                            <div className="font-bold text-sm text-white truncate">{t1?.name}</div>
                                                            {/* 추가: 선수 이름 가독성 노출 */}
                                                            <div className="text-[11px] text-slate-400 truncate">({t1 ? `${t1.player1}, ${t1.player2}` : '미지정'})</div>
                                                            
                                                            <div className="flex flex-col items-center gap-1.5 pt-2">
                                                                <div className="flex items-center justify-center gap-1">
                                                                    <button onClick={() => saveScore(m.id, Math.max(0, s1 - 1), s2, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">-</button>
                                                                    {/* 변경: 직접 타이핑 입력 창 지원 */}
                                                                    <input 
                                                                        type="number" 
                                                                        value={m.score1 !== null ? m.score1 : ''} 
                                                                        placeholder="0"
                                                                        onChange={(e) => {
                                                                            const val = e.target.value === '' ? null : Number(e.target.value);
                                                                            saveScore(m.id, val, m.score2, false);
                                                                        }}
                                                                        className="w-12 h-8 bg-slate-950 border border-slate-800 rounded-lg text-center font-black text-base text-yellow-400 focus:outline-none focus:border-yellow-400"
                                                                    />
                                                                    <button onClick={() => saveScore(m.id, s1 + 1, s2, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">+</button>
                                                                </div>
                                                                {/* 추가: 11점 원터치 승리 패드 */}
                                                                <button onClick={() => saveScore(m.id, 11, s2, false)} className="px-2 py-0.5 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 rounded-md text-[11px] font-black hover:bg-yellow-400 hover:text-slate-950 transition-all">👑 11점</button>
                                                            </div>
                                                        </div>

                                                        <div className="col-span-1 text-xs font-black text-slate-600">VS</div>

                                                        {/* 팀 2 */}
                                                        <div className="col-span-3 space-y-1">
                                                            <div className="text-xs text-slate-500 font-black">{m.team2Id}</div>
                                                            <div className="font-bold text-sm text-white truncate">{t2?.name}</div>
                                                            {/* 추가: 선수 이름 가독성 노출 */}
                                                            <div className="text-[11px] text-slate-400 truncate">({t2 ? `${t2.player1}, ${t2.player2}` : '미지정'})</div>
                                                            
                                                            <div className="flex flex-col items-center gap-1.5 pt-2">
                                                                <div className="flex items-center justify-center gap-1">
                                                                    <button onClick={() => saveScore(m.id, s1, Math.max(0, s2 - 1), false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">-</button>
                                                                    {/* 변경: 직접 타이핑 입력 창 지원 */}
                                                                    <input 
                                                                        type="number" 
                                                                        value={m.score2 !== null ? m.score2 : ''} 
                                                                        placeholder="0"
                                                                        onChange={(e) => {
                                                                            const val = e.target.value === '' ? null : Number(e.target.value);
                                                                            saveScore(m.id, m.score1, val, false);
                                                                        }}
                                                                        className="w-12 h-8 bg-slate-950 border border-slate-800 rounded-lg text-center font-black text-base text-yellow-400 focus:outline-none focus:border-yellow-400"
                                                                    />
                                                                    <button onClick={() => saveScore(m.id, s1, s2 + 1, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">+</button>
                                                                </div>
                                                                {/* 추가: 11점 원터치 승리 패드 */}
                                                                <button onClick={() => saveScore(m.id, s1, 11, false)} className="px-2 py-0.5 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 rounded-md text-[11px] font-black hover:bg-yellow-400 hover:text-slate-950 transition-all">👑 11점</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="pt-2 border-t border-slate-800/50">
                                                        {m.completed ? (
                                                            <button onClick={() => saveScore(m.id, m.score1, m.score2, false)} className="w-full py-1.5 bg-slate-950 text-slate-400 text-xs font-bold rounded-xl border border-slate-800">경기 결과 수정하기</button>
                                                        ) : (
                                                            /* 변경: 점수 유효성 검증 로직 탑재 */
                                                            <button 
                                                                onClick={() => {
                                                                    if (s1 < 11 && s2 < 11) {
                                                                        alert("⚠️ 경기를 마감할 수 없습니다!\n최소 한 팀은 11점 이상 획득해야 승리 종료 처리가 가능합니다. 점수를 확인해 주세요.");
                                                                        return;
                                                                    }
                                                                    saveScore(m.id, s1, s2, true);
                                                                }} 
                                                                className="w-full py-2 bg-emerald-500 text-slate-950 text-xs font-black rounded-xl shadow-lg"
                                                            >
                                                                경기 종료 및 스코어 확정 🔒
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 3. 선수 명단 등록 뷰 */}
                        {activeTab === 'teams' && (
                            <div className="max-w-2xl mx-auto space-y-4">
                                <div className="flex gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                                    <button onClick={() => setSelectedGroup('A')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'A' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>A조 선수 수정</button>
                                    <button onClick={() => setSelectedGroup('B')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'B' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>B조 선수 수정</button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {teams.filter(t => t.group === selectedGroup).map(t => (
                                        <div key={t.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                                            <div className="flex items-center gap-2"><span className="text-xs bg-slate-950 px-2 py-0.5 rounded text-yellow-400 font-black">{t.id}</span><span className="font-bold text-sm">{t.name}</span></div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="text" value={t.player1} onChange={(e) => updateTeamPlayers(t.id, e.target.value, t.player2)} className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-white focus:border-yellow-400 focus:outline-none" placeholder="선수A 이름"/>
                                                <input type="text" value={t.player2} onChange={(e) => updateTeamPlayers(t.id, t.player1, e.target.value)} className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-white focus:border-yellow-400 focus:outline-none" placeholder="선수B 이름"/>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. 대진 생성기 뷰 */}
                        {activeTab === 'schedule' && (
                            <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-6 shadow-xl">
                                <h3 className="text-lg font-black text-center text-white">⚙️ 스마트 대진표 생성기</h3>
                                <div className="space-y-4 text-xs font-bold text-slate-400">
                                    <div className="space-y-1">
                                        <label>가동할 피클볼 코트 개수</label>
                                        <select value={numCourts} onChange={(e) => setNumCourts(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-white">
                                            <option value={1}>1개 코트 가동</option>
                                            <option value={2}>2개 코트 가동</option>
                                            <option value={3}>3개 코트 가동</option>
                                            <option value={4}>4개 코트 가동</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label>첫 경기 개시 시간</label>
                                        <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white font-bold"/>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1">
                                            <label>경기 시간 (분)</label>
                                            <input type="number" value={gameDuration} onChange={(e) => setGameDuration(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white"/>
                                        </div>
                                        <div className="space-y-1">
                                            <label>휴식 시간 (분)</label>
                                            <input type="number" value={breakDuration} onChange={(e) => setBreakDuration(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white"/>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={generateSchedule} className="w-full py-4 bg-yellow-400 text-slate-950 font-black rounded-2xl text-sm shadow-xl shadow-yellow-400/10 active:scale-95 transition-all">
                                    🚀 공평한 대진 일정표 자동 생성하기
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
