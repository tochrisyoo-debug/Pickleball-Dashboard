<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피클볼 대회 실시간 전광판</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for inline JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client for Realtime syncing -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #030712;
        }
        /* Custom scrollbar style for bracket view */
        .bracket-scroll::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .bracket-scroll::-webkit-scrollbar-track {
            background: #111827;
            border-radius: 9999px;
        }
        .bracket-scroll::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 9999px;
        }
        .bracket-scroll::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        @keyframes subtleGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .champion-glow {
            animation: subtleGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-slate-100 select-none antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // Safe destructuring of React hooks to prevent ReferenceErrors
        const { useState, useMemo, useEffect } = React;

        // --- Core Helpers & LocalStorage Utilities ---
        const getLocalStorage = (key, defaultVal) => {
            const saved = localStorage.getItem(key);
            try {
                return saved ? JSON.parse(saved) : defaultVal;
            } catch (e) {
                return defaultVal;
            }
        };

        const setLocalStorage = (key, val) => {
            localStorage.setItem(key, JSON.stringify(val));
            window.dispatchEvent(new Event('storage_update'));
        };

        const buildInitialTeams = (countA, countB) => {
            const arr = [];
            for(let i = 1; i <= countA; i++) {
                arr.push({ id: `A${i}`, group: 'A', name: `A${i}팀`, player1: `선수 A${i}-1`, player2: `선수 A${i}-2` });
            }
            for(let i = 1; i <= countB; i++) {
                arr.push({ id: `B${i}`, group: 'B', name: `B${i}팀`, player1: `선수 B${i}-1`, player2: `선수 B${i}-2` });
            }
            return arr;
        };

        // Standard tournament matchup structures based on seed ranks
        const SEED_MATCHUPS = {
            2: [[1, 2]],
            4: [[1, 4], [2, 3]],
            8: [[1, 8], [4, 5], [3, 6], [2, 7]],
            16: [[1, 16], [8, 9], [5, 12], [4, 13], [3, 14], [6, 11], [7, 10], [2, 15]]
        };

        function App() {
            // Screen States
            const [activeTab, setActiveTab] = useState('tv');
            const [selectedGroup, setSelectedGroup] = useState('A');
            const [tvScreenMode, setTvScreenMode] = useState('A_RANK');
            const [autoRotate, setAutoRotate] = useState(true);
            const [toast, setToast] = useState(null);

            // Supabase API Integration Keys
            const [supabaseUrl, setSupabaseUrl] = useState(() => getLocalStorage('pb_supabase_url', ''));
            const [supabaseKey, setSupabaseKey] = useState(() => getLocalStorage('pb_supabase_key', ''));
            const [supabaseClient, setSupabaseClient] = useState(null);

            // Competition Options
            const [tournamentType, setTournamentType] = useState(() => getLocalStorage('pb_type', 'tournament'));
            const [numTeamsA, setNumTeamsA] = useState(() => getLocalStorage('pb_numTeamsA', 8));
            const [numTeamsB, setNumTeamsB] = useState(() => getLocalStorage('pb_numTeamsB', 9));
            const [maxGamesA, setMaxGamesA] = useState(() => getLocalStorage('pb_maxGamesA', 5));
            const [maxGamesB, setMaxGamesB] = useState(() => getLocalStorage('pb_maxGamesB', 5));

            const [numCourts, setNumCourts] = useState(3);
            const [startTime, setStartTime] = useState("10:00");
            const [gameDuration, setGameDuration] = useState(20);
            const [breakDuration, setBreakDuration] = useState(5);

            // Core Dynamic Data
            const [teams, setTeams] = useState(() => getLocalStorage('pb_teams', buildInitialTeams(8, 9)));
            const [matches, setMatches] = useState(() => getLocalStorage('pb_matches', []));

            // --- Hoisted Global Toast Helper ---
            function showToast(msg, isError = false) {
                setToast({ text: msg, isError });
                setTimeout(() => setToast(null), 3000);
            }

            // Helper to get formatted player names (Resolves team name duplication completely)
            const getPlayersString = (teamId) => {
                if (!teamId || teamId === 'BYE' || teamId.startsWith('WAIT_')) return '';
                const team = teams.find(t => t.id === teamId);
                if (!team) return '선수명 미입력';
                const p1 = team.player1;
                const p2 = team.player2;
                if (p1 || p2) {
                    return [p1, p2].filter(Boolean).join(', ');
                }
                return '선수명 미입력';
            };

            // Initialize Supabase Client on URL / Key change
            useEffect(() => {
                if (supabaseUrl && supabaseKey) {
                    try {
                        const client = supabase.createClient(supabaseUrl, supabaseKey);
                        setSupabaseClient(client);
                    } catch (e) {
                        console.error("Supabase Initialization Error", e);
                        setSupabaseClient(null);
                    }
                } else {
                    setSupabaseClient(null);
                }
            }, [supabaseUrl, supabaseKey]);

            // Unified State Broadcaster & Saver Helper
            const broadcastAndSave = (updatedTeams, updatedMatches, configs = {}) => {
                setTeams(updatedTeams);
                setMatches(updatedMatches);
                setLocalStorage('pb_teams', updatedTeams);
                setLocalStorage('pb_matches', updatedMatches);

                if (configs.tournamentType !== undefined) {
                    setTournamentType(configs.tournamentType);
                    setLocalStorage('pb_type', configs.tournamentType);
                }
                if (configs.numTeamsA !== undefined) {
                    setNumTeamsA(configs.numTeamsA);
                    setLocalStorage('pb_numTeamsA', configs.numTeamsA);
                }
                if (configs.numTeamsB !== undefined) {
                    setNumTeamsB(configs.numTeamsB);
                    setLocalStorage('pb_numTeamsB', configs.numTeamsB);
                }
                if (configs.maxGamesA !== undefined) {
                    setMaxGamesA(configs.maxGamesA);
                    setLocalStorage('pb_maxGamesA', configs.maxGamesA);
                }
                if (configs.maxGamesB !== undefined) {
                    setMaxGamesB(configs.maxGamesB);
                    setLocalStorage('pb_maxGamesB', configs.maxGamesB);
                }
                if (configs.numCourts !== undefined) setNumCourts(configs.numCourts);
                if (configs.startTime !== undefined) setStartTime(configs.startTime);
                if (configs.gameDuration !== undefined) setGameDuration(configs.gameDuration);
                if (configs.breakDuration !== undefined) setBreakDuration(configs.breakDuration);

                if (supabaseClient) {
                    const channel = supabaseClient.channel('pb-realtime-sync');
                    channel.send({
                        type: 'broadcast',
                        event: 'state-sync',
                        payload: {
                            teams: updatedTeams,
                            matches: updatedMatches,
                            tournamentType: configs.tournamentType !== undefined ? configs.tournamentType : tournamentType,
                            numTeamsA: configs.numTeamsA !== undefined ? configs.numTeamsA : numTeamsA,
                            numTeamsB: configs.numTeamsB !== undefined ? configs.numTeamsB : numTeamsB,
                            maxGamesA: configs.maxGamesA !== undefined ? configs.maxGamesA : maxGamesA,
                            maxGamesB: configs.maxGamesB !== undefined ? configs.maxGamesB : maxGamesB,
                            numCourts: configs.numCourts !== undefined ? configs.numCourts : numCourts,
                            startTime: configs.startTime !== undefined ? configs.startTime : startTime,
                            gameDuration: configs.gameDuration !== undefined ? configs.gameDuration : gameDuration,
                            breakDuration: configs.breakDuration !== undefined ? configs.breakDuration : breakDuration
                        }
                    });
                }
            };

            // Realtime Sync Subscription Hook
            useEffect(() => {
                if (!supabaseClient) return;

                const channel = supabaseClient.channel('pb-realtime-sync', {
                    config: { broadcast: { self: false } }
                });

                channel
                    .on('broadcast', { event: 'state-sync' }, ({ payload }) => {
                        if (payload) {
                            if (payload.teams) {
                                setTeams(payload.teams);
                                localStorage.setItem('pb_teams', JSON.stringify(payload.teams));
                            }
                            if (payload.matches) {
                                setMatches(payload.matches);
                                localStorage.setItem('pb_matches', JSON.stringify(payload.matches));
                            }
                            if (payload.tournamentType) {
                                setTournamentType(payload.tournamentType);
                                localStorage.setItem('pb_type', JSON.stringify(payload.tournamentType));
                            }
                            if (payload.numTeamsA) {
                                setNumTeamsA(payload.numTeamsA);
                                localStorage.setItem('pb_numTeamsA', JSON.stringify(payload.numTeamsA));
                            }
                            if (payload.numTeamsB) {
                                setNumTeamsB(payload.numTeamsB);
                                localStorage.setItem('pb_numTeamsB', JSON.stringify(payload.numTeamsB));
                            }
                            if (payload.maxGamesA) {
                                setMaxGamesA(payload.maxGamesA);
                                localStorage.setItem('pb_maxGamesA', JSON.stringify(payload.maxGamesA));
                            }
                            if (payload.maxGamesB) {
                                setMaxGamesB(payload.maxGamesB);
                                localStorage.setItem('pb_maxGamesB', JSON.stringify(payload.maxGamesB));
                            }
                            if (payload.numCourts !== undefined) setNumCourts(payload.numCourts);
                            if (payload.startTime !== undefined) setStartTime(payload.startTime);
                            if (payload.gameDuration !== undefined) setGameDuration(payload.gameDuration);
                            if (payload.breakDuration !== undefined) setBreakDuration(payload.breakDuration);

                            showToast("🔄 다른 기기로부터 실시간 변경사항이 반영되었습니다!");
                        }
                    })
                    .on('broadcast', { event: 'request-state' }, () => {
                        // Broadcast back current master state to newly joined client
                        channel.send({
                            type: 'broadcast',
                            event: 'state-sync',
                            payload: {
                                teams: getLocalStorage('pb_teams', []),
                                matches: getLocalStorage('pb_matches', []),
                                tournamentType: getLocalStorage('pb_type', 'tournament'),
                                numTeamsA: getLocalStorage('pb_numTeamsA', 8),
                                numTeamsB: getLocalStorage('pb_numTeamsB', 9),
                                maxGamesA: getLocalStorage('pb_maxGamesA', 5),
                                maxGamesB: getLocalStorage('pb_maxGamesB', 5),
                                numCourts,
                                startTime,
                                gameDuration,
                                breakDuration
                            }
                        });
                    })
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            // Signal other devices to send latest state if they are active
                            channel.send({
                                type: 'broadcast',
                                event: 'request-state',
                                payload: {}
                            });
                        }
                    });

                return () => {
                    supabaseClient.removeChannel(channel);
                };
            }, [supabaseClient, numCourts, startTime, gameDuration, breakDuration, tournamentType, numTeamsA, numTeamsB, maxGamesA, maxGamesB]);

            // Setup Storage Syncing across local browser tabs
            useEffect(() => {
                const handleStorageUpdate = () => {
                    setTeams(getLocalStorage('pb_teams', []));
                    setMatches(getLocalStorage('pb_matches', []));
                    setTournamentType(getLocalStorage('pb_type', 'tournament'));
                };
                window.addEventListener('storage_update', handleStorageUpdate);
                return () => window.removeEventListener('storage_update', handleStorageUpdate);
            }, []);

            // Automatic Screen Rotator for the TV Dashboard
            useEffect(() => {
                if (!autoRotate) return;
                const interval = setInterval(() => {
                    setTvScreenMode(prev => {
                        if (prev === 'A_RANK') return 'B_RANK';
                        if (prev === 'B_RANK') return 'LIVE_COURT';
                        return 'A_RANK';
                    });
                }, 12000);
                return () => clearInterval(interval);
            }, [autoRotate]);

            // Propagator engine to bubble wins upwards inside Single-Elimination tree structure safely
            const propagateWinners = (matchesList) => {
                let updated = matchesList.map(m => ({ ...m }));

                // 1. Instantly process initial round BYEs
                updated = updated.map(m => {
                    if (m.team1Id === 'BYE' || m.team2Id === 'BYE') {
                        if (m.team1Id === 'BYE' && m.team2Id === 'BYE') {
                            return { ...m, score1: 0, score2: 0, completed: true, winnerId: 'BYE' };
                        } else if (m.team1Id === 'BYE') {
                            return { ...m, score1: 0, score2: 11, completed: true, winnerId: m.team2Id };
                        } else if (m.team2Id === 'BYE') {
                            return { ...m, score1: 11, score2: 0, completed: true, winnerId: m.team1Id };
                        }
                    }
                    return m;
                });

                // 2. Loop dynamic passes (Max tree height is 4 rounds for 16 teams)
                for (let pass = 0; pass < 5; pass++) {
                    updated = updated.map(m => {
                        let winnerId = null;
                        if (m.completed) {
                            if (m.winnerId) {
                                winnerId = m.winnerId;
                            } else {
                                if (m.score1 > m.score2) winnerId = m.team1Id;
                                else if (m.score2 > m.score1) winnerId = m.team2Id;
                            }
                        }

                        // Propagate winner to designated slot in next match
                        if (winnerId && m.nextMatchId) {
                            const nextMatchIdx = updated.findIndex(nm => nm.id === m.nextMatchId);
                            if (nextMatchIdx !== -1) {
                                const nextMatch = updated[nextMatchIdx];
                                if (m.nextSlot === 1 && nextMatch.team1Id !== winnerId) {
                                    nextMatch.team1Id = winnerId;
                                } else if (m.nextSlot === 2 && nextMatch.team2Id !== winnerId) {
                                    nextMatch.team2Id = winnerId;
                                }
                            }
                        }

                        // Safety Trigger: If parent is edited back to UNCOMPLETED, push placeholder back down the tree
                        if (!m.completed && m.nextMatchId) {
                            const nextMatchIdx = updated.findIndex(nm => nm.id === m.nextMatchId);
                            if (nextMatchIdx !== -1) {
                                const nextMatch = updated[nextMatchIdx];
                                const placeholder = `WAIT_${m.id}`;
                                if (m.nextSlot === 1 && nextMatch.team1Id !== placeholder) {
                                    nextMatch.team1Id = placeholder;
                                    nextMatch.score1 = null;
                                    nextMatch.completed = false;
                                } else if (m.nextSlot === 2 && nextMatch.team2Id !== placeholder) {
                                    nextMatch.team2Id = placeholder;
                                    nextMatch.score2 = null;
                                    nextMatch.completed = false;
                                }
                            }
                        }
                        return m;
                    });
                }
                return updated;
            };

            // Dynamic Seeding and Match Scheduler Builder with Balanced Court Routing
            const handleGenerateSchedule = () => {
                const updatedTeams = [];
                for(let i = 1; i <= numTeamsA; i++) {
                    const ex = teams.find(t => t.id === `A${i}`);
                    updatedTeams.push(ex || { id: `A${i}`, group: 'A', name: `A${i}팀`, player1: '', player2: '' });
                }
                for(let i = 1; i <= numTeamsB; i++) {
                    const ex = teams.find(t => t.id === `B${i}`);
                    updatedTeams.push(ex || { id: `B${i}`, group: 'B', name: `B${i}팀`, player1: '', player2: '' });
                }

                let allGames = [];

                if (tournamentType === 'league') {
                    // --- Round Robin League Generator ---
                    const makeLeague = (groupName, groupTeams, maxLimit) => {
                        let list = [...groupTeams];
                        if (list.length % 2 !== 0) list.push({ id: 'BYE', name: '부전승' });
                        const rounds = [];
                        const NT = list.length;
                        for (let r = 0; r < NT - 1; r++) {
                            const rGames = [];
                            for (let i = 0; i < NT / 2; i++) {
                                const t1 = list[i]; 
                                const t2 = list[NT - 1 - i];
                                if (t1.id !== 'BYE' && t2.id !== 'BYE') {
                                    rGames.push({ 
                                        group: groupName, 
                                        team1Id: t1.id, 
                                        team2Id: t2.id, 
                                        roundIndex: r + 1,
                                        roundName: `${r+1}R`,
                                        completed: false,
                                        score1: null,
                                        score2: null,
                                        id: `L_${groupName}_R${r+1}_G${i+1}`
                                    });
                                }
                            }
                            rounds.push(rGames);
                            list.splice(1, 0, list.pop());
                        }
                        let sliced = [];
                        const finalLimit = Math.min(maxLimit, NT - 1);
                        for(let k = 0; k < finalLimit; k++) sliced.push(...rounds[k]);
                        return sliced;
                    };
                    allGames.push(...makeLeague('A', updatedTeams.filter(t => t.group === 'A'), maxGamesA));
                    allGames.push(...makeLeague('B', updatedTeams.filter(t => t.group === 'B'), maxGamesB));

                } else {
                    // --- Single Elimination Bracket Generator ---
                    const buildTreeForGroup = (groupName, teamCount) => {
                        let base = 2;
                        if (teamCount > 2) base = 4;
                        if (teamCount > 4) base = 8;
                        if (teamCount > 8) base = 16;

                        const numRounds = Math.log2(base);
                        const matchups = SEED_MATCHUPS[base];
                        const groupMatches = [];

                        const getRoundLabel = (rIndex) => {
                            const matchesInRound = base / Math.pow(2, rIndex);
                            if (matchesInRound === 1) return "🥇 최종 결승전";
                            if (matchesInRound === 2) return "🏅 4강 준결승";
                            if (matchesInRound === 4) return "8강전";
                            return "토너먼트 1R";
                        };

                        // Build Round 1 Nodes
                        for (let m = 0; m < base / 2; m++) {
                            const [seed1, seed2] = matchups[m];
                            const t1 = seed1 <= teamCount ? `${groupName}${seed1}` : "BYE";
                            const t2 = seed2 <= teamCount ? `${groupName}${seed2}` : "BYE";
                            const matchId = `M_${groupName}_R1_M${m + 1}`;
                            
                            groupMatches.push({
                                id: matchId,
                                group: groupName,
                                roundIndex: 1,
                                roundName: getRoundLabel(1),
                                team1Id: t1,
                                team2Id: t2,
                                score1: null,
                                score2: null,
                                completed: false,
                                nextMatchId: numRounds > 1 ? `M_${groupName}_R2_M${Math.floor(m / 2) + 1}` : null,
                                nextSlot: numRounds > 1 ? (m % 2) + 1 : null
                            });
                        }

                        // Build Round 2 to Finals Nodes
                        for (let r = 2; r <= numRounds; r++) {
                            const numMatchesInRound = base / Math.pow(2, r);
                            for (let m = 0; m < numMatchesInRound; m++) {
                                const matchId = `M_${groupName}_R${r}_M${m + 1}`;
                                groupMatches.push({
                                    id: matchId,
                                    group: groupName,
                                    roundIndex: r,
                                    roundName: getRoundLabel(r),
                                    team1Id: `WAIT_M_${groupName}_R${r-1}_M${2*m+1}`,
                                    team2Id: `WAIT_M_${groupName}_R${r-1}_M${2*m+2}`,
                                    score1: null,
                                    score2: null,
                                    completed: false,
                                    nextMatchId: r < numRounds ? `M_${groupName}_R${r+1}_M${Math.floor(m / 2) + 1}` : null,
                                    nextSlot: r < numRounds ? (m % 2) + 1 : null
                                });
                            }
                        }
                        return groupMatches;
                    };

                    allGames.push(...buildTreeForGroup('A', numTeamsA));
                    allGames.push(...buildTreeForGroup('B', numTeamsB));

                    // Propagate initial BYEs before scheduling
                    allGames = propagateWinners(allGames);
                }

                // --- Advanced Unified Court Scheduler ---
                // Filter out BYE matches
                let matchesToSchedule = allGames.filter(m => {
                    const isByeMatch = m.team1Id === "BYE" || m.team2Id === "BYE";
                    return !isByeMatch;
                });

                // Weight rounds to schedule logically
                const getRoundWeight = (roundName) => {
                    if (roundName.includes("1R")) return 1;
                    if (roundName.includes("8강")) return 2;
                    if (roundName.includes("4강") || roundName.includes("준결승")) return 3;
                    if (roundName.includes("결승") || roundName.includes("Final")) return 4;
                    const match = roundName.match(/(\d+)R/);
                    if (match) return parseInt(match[1]) * 10;
                    return 100;
                };

                // Sort games so earlier rounds are scheduled first
                matchesToSchedule.sort((a, b) => {
                    const wA = getRoundWeight(a.roundName);
                    const wB = getRoundWeight(b.roundName);
                    if (wA !== wB) return wA - wB;
                    if (a.group !== b.group) return a.group.localeCompare(b.group);
                    return a.id.localeCompare(b.id);
                });

                const scheduledMatches = [];
                let slotIndex = 0;
                let lastMajorityGroup = null;
                let currentTimeMin = (() => {
                    const [h, m] = startTime.split(':').map(Number);
                    return h * 60 + m;
                })();

                while (matchesToSchedule.length > 0) {
                    let slotMatches = [];
                    let usedTeamsInSlot = new Set();
                    
                    // Decides priority group based on ratio from last time slot
                    let priorityGroup = lastMajorityGroup === 'A' ? 'B' : 'A';

                    // Retrieve teams that played in previous slot (rest constraint check)
                    const lastSlotTeams = new Set();
                    if (slotIndex > 0) {
                        const prevSlotTime = (() => {
                            const prevMin = currentTimeMin + (slotIndex - 1) * (Number(gameDuration) + Number(breakDuration));
                            const h = String(Math.floor(prevMin / 60) % 24).padStart(2, '0');
                            const m = String(prevMin % 60).padStart(2, '0');
                            return `${h}:${m}`;
                        })();
                        scheduledMatches
                            .filter(m => m.time === prevSlotTime)
                            .forEach(m => {
                                lastSlotTeams.add(m.team1Id);
                                lastSlotTeams.add(m.team2Id);
                            });
                    }

                    const findBestMatchIndex = (preferGroup) => {
                        const checkMatch = (m, checkGroup, avoidTeams) => {
                            if (m.group !== checkGroup) return false;
                            const t1 = m.team1Id;
                            const t2 = m.team2Id;
                            if (usedTeamsInSlot.has(t1) || usedTeamsInSlot.has(t2)) return false;
                            if (avoidTeams && (avoidTeams.has(t1) || avoidTeams.has(t2))) return false;
                            return true;
                        };

                        // 1. Prefer + Rested
                        let idx = matchesToSchedule.findIndex(m => checkMatch(m, preferGroup, lastSlotTeams));
                        if (idx !== -1) return idx;

                        // 2. Alt + Rested
                        const altGroup = preferGroup === 'A' ? 'B' : 'A';
                        idx = matchesToSchedule.findIndex(m => checkMatch(m, altGroup, lastSlotTeams));
                        if (idx !== -1) return idx;

                        // 3. Prefer (Ignore soft rest)
                        idx = matchesToSchedule.findIndex(m => checkMatch(m, preferGroup, null));
                        if (idx !== -1) return idx;

                        // 4. Alt (Ignore soft rest)
                        idx = matchesToSchedule.findIndex(m => checkMatch(m, altGroup, null));
                        if (idx !== -1) return idx;

                        return -1;
                    };

                    // Distribute across active courts
                    for (let c = 0; c < numCourts; c++) {
                        let targetGroup = priorityGroup;
                        if (slotMatches.length > 0) {
                            const aInSlot = slotMatches.filter(sm => sm.group === 'A').length;
                            const bInSlot = slotMatches.filter(sm => sm.group === 'B').length;
                            targetGroup = aInSlot > bInSlot ? 'B' : 'A';
                        }

                        const bestIdx = findBestMatchIndex(targetGroup);
                        if (bestIdx !== -1) {
                            const match = matchesToSchedule[bestIdx];
                            slotMatches.push(match);
                            usedTeamsInSlot.add(match.team1Id);
                            usedTeamsInSlot.add(match.team2Id);
                            matchesToSchedule.splice(bestIdx, 1);
                        }
                    }

                    if (slotMatches.length === 0) break;

                    const slotTimeMin = currentTimeMin + slotIndex * (Number(gameDuration) + Number(breakDuration));
                    const h = String(Math.floor(slotTimeMin / 60) % 24).padStart(2, '0');
                    const m = String(slotTimeMin % 60).padStart(2, '0');
                    const timeString = `${h}:${m}`;

                    slotMatches.forEach((match, idx) => {
                        match.time = timeString;
                        match.court = `Court ${idx + 1}`;
                        scheduledMatches.push(match);
                    });

                    const aCount = slotMatches.filter(sm => sm.group === 'A').length;
                    const bCount = slotMatches.filter(sm => sm.group === 'B').length;
                    if (aCount !== bCount) {
                        lastMajorityGroup = aCount > bCount ? 'A' : 'B';
                    }

                    slotIndex++;
                }

                const unscheduledByes = allGames.filter(m => {
                    const isByeMatch = m.team1Id === "BYE" || m.team2Id === "BYE";

                groupTeams.forEach(t => {

                    if (t1 && t2) {

                        t2.played++;
                        t1.pf += (m.score1 || 0); 
                        t1.pa += (m.score2 || 0);

                        if ((m.score1 || 0) > (m.score2 || 0)) {

                            t2.losses++;

                                                    showToast("📡 연동 정보가 초기화되었습니다. (단독 구동 모드)");
                                                }}
                                                className="px-4 py-2 bg-slate-950 hover:bg-slate-900 border border-slate-800 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-400 transition-all"
                                            >
                                                초기화
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-6 shadow-xl text-left">
                                    <div className="text-center space-y-1">
                                        <h3 className="text-xl font-extrabold text-white">⚙️ 스마트 대진 관리 환경설정</h3>
                                        <p className="text-xs text-slate-400">대진 방식과 실시간 코트 운영 조건을 빌드합니다.</p>
                                    </div>

                                    <div className="border-t border-slate-800 pt-5 space-y-5">
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-400 uppercase tracking-wide block">
                                                🏆 대회 대진 시스템 방식 설정
                                            </label>
                                            <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                                                <button onClick={() => setTournamentType('league')} className={`py-3 rounded-xl font-extrabold text-sm transition-all ${tournamentType === 'league' ? 'bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                                                    풀 리그전 모드 (League)
                                                </button>
                                                <button onClick={() => setTournamentType('tournament')} className={`py-3 rounded-xl font-extrabold text-sm transition-all ${tournamentType === 'tournament' ? 'bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                                                    토너먼트 트리 (Tournament)
                                                </button>
                                            </div>
                                        </div>

                                        {/* Group A Settings */}
                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-4">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase tracking-wider">🅰️ A조 경기 세팅</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] text-slate-400 font-bold block">A조 참여 팀 수 (2~16)</label>
                                                    <input type="number" min="2" max="16" value={numTeamsA} onChange={(e) => setNumTeamsA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2.5 text-sm rounded-xl text-white text-center font-bold focus:outline-none focus:border-yellow-400" />
                                                </div>
                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] text-slate-400 font-bold block">팀당 제한 매치 (리그전용)</label>
                                                    <input type="number" disabled={tournamentType === 'tournament'} min="1" max={numTeamsA} value={maxGamesA} onChange={(e) => setMaxGamesA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2.5 text-sm rounded-xl text-white text-center font-bold disabled:opacity-20 focus:outline-none focus:border-yellow-400" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Group B Settings */}
                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-4">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase tracking-wider">🅱️ B조 경기 세팅</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] text-slate-400 font-bold block">B조 참여 팀 수 (2~16)</label>
                                                    <input type="number" min="2" max="16" value={numTeamsB} onChange={(e) => setNumTeamsB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2.5 text-sm rounded-xl text-white text-center font-bold focus:outline-none focus:border-yellow-400" />
                                                </div>
                                                <div className="space-y-1.5">
                                                    <label className="text-[11px] text-slate-400 font-bold block">팀당 제한 매치 (리그전용)</label>
                                                    <input type="number" disabled={tournamentType === 'tournament'} min="1" max={numTeamsB} value={maxGamesB} onChange={(e) => setMaxGamesB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2.5 text-sm rounded-xl text-white text-center font-bold disabled:opacity-20 focus:outline-none focus:border-yellow-400" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Gym Court & Time Setup */}
                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-4">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase tracking-wider">🗓️ 체육관 코트 및 시간 설정</h4>
                                            <div className="space-y-3 text-xs font-bold text-slate-400">
                                                <div className="space-y-1">
                                                    <label>체육관 운영 코트 수</label>
                                                    <select value={numCourts} onChange={(e) => setNumCourts(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-white font-bold focus:outline-none">
                                                        <option value={1}>1개 코트 가동</option>
                                                        <option value={2}>2개 코트 배치</option>
                                                        <option value={3}>3개 코트 가동</option>
                                                        <option value={4}>4개 코트 가동</option>
                                                    </select>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4 pt-1">
                                                    <div className="space-y-1">
                                                        <label>대회 시작 시간</label>
                                                        <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-xl text-white text-center font-bold focus:outline-none" />
                                                    </div>
                                                    <div className="space-y-1">
                                                        <label>경기 간격 주기 (분)</label>
                                                        <input type="number" value={gameDuration} onChange={(e) => setGameDuration(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-xl text-white text-center font-bold focus:outline-none" />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={handleGenerateSchedule} className="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black rounded-2xl text-sm shadow-xl shadow-yellow-950/20 transition-all">
                                        🚀 최적화 맞춤 대진 스케줄 빌드하기
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
