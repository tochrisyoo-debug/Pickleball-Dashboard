<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHURCH PICKLEBALL 통합 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #030712; }
        .bracket-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .bracket-scroll::-webkit-scrollbar-track { background: #111827; border-radius: 9999px; }
        .bracket-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
        @keyframes subtleGlow { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }
        .champion-glow { animation: subtleGlow 3s infinite ease-in-out; }
    </style>
</head>
<body class="text-slate-100 select-none antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // --- Utils ---
        const getLocalStorage = (key, defaultVal) => {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : defaultVal;
        };

        const setLocalStorage = (key, val) => {
            localStorage.setItem(key, JSON.stringify(val));
            window.dispatchEvent(new Event('storage_update'));
        };

        const buildInitialTeams = (countA, countB) => {
            const arr = [];
            for(let i = 1; i <= countA; i++) arr.push({ id: `A${i}`, group: 'A', name: `A${i}팀`, player1: `선수 A${i}-1`, player2: `선수 A${i}-2` });
            for(let i = 1; i <= countB; i++) arr.push({ id: `B${i}`, group: 'B', name: `B${i}팀`, player1: `선수 B${i}-1`, player2: `선수 B${i}-2` });
            return arr;
        };

        function App() {
            // --- State ---
            const [activeTab, setActiveTab] = React.useState('tv');
            const [selectedGroup, setSelectedGroup] = React.useState('A');
            const [tvScreenMode, setTvScreenMode] = React.useState('A_RANK');
            const [autoRotate, setAutoRotate] = React.useState(true);
            const [toast, setToast] = React.useState(null);

            const [tournamentType, setTournamentType] = React.useState(() => getLocalStorage('pb_type', 'tournament'));
            const [numTeamsA, setNumTeamsA] = React.useState(() => getLocalStorage('pb_numTeamsA', 8));
            const [numTeamsB, setNumTeamsB] = React.useState(() => getLocalStorage('pb_numTeamsB', 8));
            const [numCourts, setNumCourts] = React.useState(3);
            const [startTime, setStartTime] = React.useState("10:00");
            const [gameDuration, setGameDuration] = React.useState(20);
            
            const [teams, setTeams] = React.useState(() => getLocalStorage('pb_teams', buildInitialTeams(8, 8)));
            const [matches, setMatches] = React.useState(() => getLocalStorage('pb_matches', []));

            // --- Logic ---
            const showToast = (msg, isError = false) => {
                setToast({ text: msg, isError });
                setTimeout(() => setToast(null), 3000);
            };

            // 통합 지능형 스케줄러 (Piece 1 로직 통합)
            const generateIntegratedSchedule = () => {
                // 1. 초기 데이터 빌드
                const newTeams = buildInitialTeams(numTeamsA, numTeamsB);
                setTeams(newTeams);
                setLocalStorage('pb_teams', newTeams);

                // 2. 대진 생성 (기본 로직)
                let tempMatches = [];
                // 간소화된 대진 생성 (실제 토너먼트/리그 규칙에 따라 확장 가능)
                for(let i=0; i < Math.max(numTeamsA, numTeamsB); i++) {
                     if(i < numTeamsA) tempMatches.push({ id: `A-M${i}`, group: 'A', round: 'R1', home: { teamName: `A${i+1}팀` }, away: { teamName: `A${(i+1)%numTeamsA+1}팀` }, status: 'ready' });
                     if(i < numTeamsB) tempMatches.push({ id: `B-M${i}`, group: 'B', round: 'R1', home: { teamName: `B${i+1}팀` }, away: { teamName: `B${(i+1)%numTeamsB+1}팀` }, status: 'ready' });
                }

                // 3. 지능형 코트 배정 (Piece 1 로직 적용)
                let readyMatches = [...tempMatches];
                const schedule = [];
                let timeSlot = 1;
                let lastMajorityGroup = null;

                while (readyMatches.length > 0) {
                    let currentSlot = [];
                    let usedTeams = new Set();
                    let priorityGroup = lastMajorityGroup === 'A' ? 'B' : 'A';
                    
                    for (let i = 0; i < numCourts; i++) {
                        let pool = readyMatches.filter(m => m.group === priorityGroup);
                        if (pool.length === 0) pool = readyMatches.filter(m => m.group !== priorityGroup);
                        
                        const match = pool.find(m => !usedTeams.has(m.home.teamName) && !usedTeams.has(m.away.teamName));
                        if (match) {
                            currentSlot.push({ ...match, court: `Court ${i+1}`, time: timeSlot });
                            usedTeams.add(match.home.teamName);
                            usedTeams.add(match.away.teamName);
                            readyMatches = readyMatches.filter(m => m.id !== match.id);
                        }
                    }
                    
                    const aCount = currentSlot.filter(m => m.group === 'A').length;
                    const bCount = currentSlot.filter(m => m.group === 'B').length;
                    if (aCount !== bCount) lastMajorityGroup = aCount > bCount ? 'A' : 'B';
                    
                    if (currentSlot.length === 0) break;
                    schedule.push(...currentSlot);
                    timeSlot++;
                }

                setMatches(schedule);
                setLocalStorage('pb_matches', schedule);
                showToast("🚀 지능형 대진 스케줄이 배정되었습니다!");
            };

            // --- UI ---
            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                        <h1 className="text-xl font-bold text-yellow-400">CHURCH PICKLEBALL</h1>
                        <nav className="flex gap-2">
                            {['tv', 'admin', 'teams', 'schedule'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 rounded-lg text-sm font-bold ${activeTab === tab ? 'bg-yellow-500 text-slate-900' : 'text-slate-400'}`}>
                                    {tab.toUpperCase()}
                                </button>
                            ))}
                        </nav>
                    </header>

                    <main className="flex-1 p-6 max-w-5xl mx-auto w-full">
                        {/* 스케줄러 탭: 지능형 배정 */}
                        {activeTab === 'schedule' && (
                            <div className="bg-slate-900 p-8 rounded-2xl border border-slate-800">
                                <h2 className="text-2xl font-black mb-6">대진 및 코트 설정</h2>
                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    <input type="number" value={numTeamsA} onChange={e=>setNumTeamsA(Number(e.target.value))} placeholder="A조 팀 수" className="p-3 bg-slate-950 rounded-xl"/>
                                    <input type="number" value={numTeamsB} onChange={e=>setNumTeamsB(Number(e.target.value))} placeholder="B조 팀 수" className="p-3 bg-slate-950 rounded-xl"/>
                                    <select value={numCourts} onChange={e=>setNumCourts(Number(e.target.value))} className="p-3 bg-slate-950 rounded-xl">
                                        <option value={1}>1 코트</option><option value={2}>2 코트</option><option value={3}>3 코트</option>
                                    </select>
                                </div>
                                <button onClick={generateIntegratedSchedule} className="w-full py-4 bg-yellow-500 text-slate-900 font-black rounded-xl hover:bg-yellow-400 transition-all">
                                    🚀 스마트 스케줄 생성 (A/B조 균형 배정)
                                </button>
                            </div>
                        )}

                        {/* 현황판 탭: 스케줄 표시 */}
                        {activeTab === 'tv' && (
                            <div className="space-y-6">
                                {matches.map((m, idx) => (
                                    <div key={idx} className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                                        <div>
                                            <span className="text-xs bg-yellow-500 text-black px-2 py-1 rounded">{m.court}</span>
                                            <span className="ml-2 font-bold">{m.home.teamName} vs {m.away.teamName}</span>
                                        </div>
                                        <div className="text-sm font-mono text-slate-400">Time Slot: {m.time}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {toast && (
                        <div className="fixed bottom-10 right-10 bg-yellow-500 text-black p-4 rounded-xl font-bold shadow-2xl">
                            {toast.text}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
