<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교회 피클볼 대회 실시간 전광판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white select-none">
    <div id="root"></div>

    <script type="text/babel">
        // --- 로컬 스토리지 데이터 코어 ---
        const getLocalStorage = (key, defaultVal) => {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : defaultVal;
        };
        const setLocalStorage = (key, val) => {
            localStorage.setItem(key, JSON.stringify(val));
            window.dispatchEvent(new Event('storage_update'));
        };

        const buildInitialTeams = (countA, countB) => {
            const arr = [];
            for(let i=1; i<=countA; i++) arr.push({ id: `A${i}`, group: 'A', name: `A${i}팀`, player1: `선수 ${i}A`, player2: `선수 ${i}B` });
            for(let i=1; i<=countB; i++) arr.push({ id: `B${i}`, group: 'B', name: `B${i}팀`, player1: `성도 ${i}A`, player2: `성도 ${i}B` });
            return arr;
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('tv');
            const [tournamentType, setTournamentType] = React.useState(() => getLocalStorage('pb_type', 'league'));
            
            const [numTeamsA, setNumTeamsA] = React.useState(() => getLocalStorage('pb_numTeamsA', 6));
            const [numTeamsB, setNumTeamsB] = React.useState(() => getLocalStorage('pb_numTeamsB', 10));
            const [maxGamesA, setMaxGamesA] = React.useState(() => getLocalStorage('pb_maxGamesA', 5));
            const [maxGamesB, setMaxGamesB] = React.useState(() => getLocalStorage('pb_maxGamesB', 5));

            const [teams, setTeams] = React.useState(() => getLocalStorage('pb_teams', buildInitialTeams(6, 10)));
            const [matches, setMatches] = React.useState(() => getLocalStorage('pb_matches', []));
            
            const [selectedGroup, setSelectedGroup] = React.useState('A');
            const [tvScreenMode, setTvScreenMode] = React.useState('A_RANK');
            const [autoRotate, setAutoRotate] = React.useState(true);
            const [toast, setToast] = React.useState(null);

            const [numCourts, setNumCourts] = React.useState(3);
            const [startTime, setStartTime] = React.useState("10:00");
            const [gameDuration, setGameDuration] = React.useState(20);
            const [breakDuration, setBreakDuration] = React.useState(5);

            React.useEffect(() => {
                const handleStorageUpdate = () => {
                    setTeams(getLocalStorage('pb_teams', []));
                    setMatches(getLocalStorage('pb_matches', []));
                    setTournamentType(getLocalStorage('pb_type', 'league'));
                    setNumTeamsA(getLocalStorage('pb_numTeamsA', 6));
                    setNumTeamsB(getLocalStorage('pb_numTeamsB', 10));
                };
                window.addEventListener('storage_update', handleStorageUpdate);
                return () => window.removeEventListener('storage_update', handleStorageUpdate);
            }, []);

            // TV 화면 삼각 로테이션 스위칭 엔진
            React.useEffect(() => {
                if (!autoRotate) return;
                const interval = setInterval(() => {
                    setTvScreenMode(prev => {
                        if (prev === 'A_RANK') return 'B_RANK';
                        if (prev === 'B_RANK') return 'LIVE_COURT';
                        return 'A_RANK';
                    });
                }, 12000);
                return () => clearInterval(interval);
            }, [autoRotate]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };

            const handleGenerateSchedule = () => {
                if (matches.length > 0 && !confirm("⚠️ 대진표를 다시 짜면 기존 모든 결과가 리셋됩니다. 계속할까요?")) return;

                setLocalStorage('pb_type', tournamentType);
                setLocalStorage('pb_numTeamsA', numTeamsA);
                setLocalStorage('pb_numTeamsB', numTeamsB);
                setLocalStorage('pb_maxGamesA', maxGamesA);
                setLocalStorage('pb_maxGamesB', maxGamesB);

                const updatedTeams = [];
                for(let i=1; i<=numTeamsA; i++) {
                    const ex = teams.find(t => t.id === `A${i}`);
                    updatedTeams.push(ex || { id: `A${i}`, group: 'A', name: `A${i}팀`, player1: '', player2: '' });
                }
                for(let i=1; i<=numTeamsB; i++) {
                    const ex = teams.find(t => t.id === `B${i}`);
                    updatedTeams.push(ex || { id: `B${i}`, group: 'B', name: `B${i}팀`, player1: '', player2: '' });
                }
                setTeams(updatedTeams);
                setLocalStorage('pb_teams', updatedTeams);

                let allGames = [];

                if (tournamentType === 'league') {
                    const makeLeague = (groupName, groupTeams, limitParam) => {
                        let list = [...groupTeams];
                        if (list.length % 2 !== 0) list.push({ id: 'BYE', name: '부전승' });
                        const rounds = [];
                        const NT = list.length;
                        for (let r = 0; r < NT - 1; r++) {
                            const rGames = [];
                            for (let i = 0; i < NT / 2; i++) {
                                const t1 = list[i]; const t2 = list[NT - 1 - i];
                                if (t1.id !== 'BYE' && t2.id !== 'BYE') {
                                    rGames.push({ group: groupName, team1Id: t1.id, team2Id: t2.id, roundName: `${r+1}R` });
                                }
                            }
                            rounds.push(rGames);
                            list.splice(1, 0, list.pop());
                        }
                        let sliced = [];
                        const finalLimit = Math.min(limitParam, NT - 1);
                        for(let k=0; k<finalLimit; k++) sliced.push(...rounds[k]);
                        return sliced;
                    };
                    allGames.push(...makeLeague('A', updatedTeams.filter(t => t.group === 'A'), maxGamesA));
                    allGames.push(...makeLeague('B', updatedTeams.filter(t => t.group === 'B'), maxGamesB));

                } else {
                    // 정방향 부전승 로직 탑재 토너먼트 1R 빌더
                    const makeTournamentRound1 = (groupName, groupTeams) => {
                        const list = [...groupTeams].sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
                        const NT = list.length;
                        if (NT < 2) return [];

                        let bracketSize = 4;
                        if (NT > 4) bracketSize = 8;
                        if (NT > 8) bracketSize = 16;

                        const r1MatchesCount = NT - (bracketSize / 2);
                        const tGames = [];

                        for(let i=0; i<r1MatchesCount; i++) {
                            const t2 = list.pop(); 
                            const t1 = list.pop(); 
                            if (t1 && t2) {
                                tGames.push({ group: groupName, team1Id: t1.id, team2Id: t2.id, roundName: '토너먼트 1R' });
                            }
                        }
                        return tGames;
                    };
                    allGames.push(...makeTournamentRound1('A', updatedTeams.filter(t => t.group === 'A')));
                    allGames.push(...makeTournamentRound1('B', updatedTeams.filter(t => t.group === 'B')));
                }

                let currentMin = (() => {
                    const [h, m] = startTime.split(':').map(Number);
                    return h * 60 + m;
                })();

                let courtIdx = 1;
                const finalMatches = allGames.map((g, idx) => {
                    const h = String(Math.floor(currentMin / 60) % 24).padStart(2, '0');
                    const m = String(currentMin % 60).padStart(2, '0');
                    const matchTime = `${h}:${m}`;
                    const courtName = `${courtIdx}코트`;

                    courtIdx++;
                    if (courtIdx > numCourts) {
                        courtIdx = 1;
                        currentMin += (Number(gameDuration) + Number(breakDuration));
                    }

                    return {
                        id: `match_${idx + 1}`,
                        ...g,
                        score1: null, score2: null, completed: false,
                        time: matchTime, court: courtName
                    };
                });

                setMatches(finalMatches);
                setLocalStorage('pb_matches', finalMatches);
                showToast("🏆 대진표 배치가 성공적으로 끝났습니다!");
            };

            const saveScore = (matchId, s1, s2, completed) => {
                let updated = matches.map(m => m.id === matchId ? { ...m, score1: s1, score2: s2, completed } : m);
                
                if (completed && tournamentType === 'tournament') {
                    const comp = updated.find(m => m.id === matchId);
                    const group = comp.group;

                    const activeGroupMatches = updated.filter(m => m.group === group && m.roundName === comp.roundName);
                    const allDone = activeGroupMatches.every(m => m.completed);

                    if (allDone) {
                        const winners = activeGroupMatches.map(m => (m.score1 > m.score2 ? m.team1Id : m.team2Id));
                        const allGroupTeams = teams.filter(t => t.group === group).map(t => t.id);
                        
                        const playedTeams = new Set();
                        activeGroupMatches.forEach(m => { playedTeams.add(m.team1Id); playedTeams.add(m.team2Id); });
                        const byeTeams = allGroupTeams.filter(tid => !playedTeams.has(tid));

                        const nextRoundTeams = [...winners, ...byeTeams].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
                        
                        if (nextRoundTeams.length >= 2) {
                            let nextRoundLabel = "토너먼트 2R";
                            if (nextRoundTeams.length <= 2) nextRoundLabel = "🥇 최종 결승전";
                            else if (nextRoundTeams.length <= 4) nextRoundLabel = "🏅 4강 준결승";

                            const alreadyMade = updated.some(m => m.group === group && m.roundName === nextRoundLabel);
                            if (!alreadyMade) {
                                const nextMatches = [];
                                for(let i=0; i<nextRoundTeams.length; i+=2) {
                                    if(nextRoundTeams[i+1]) {
                                        nextMatches.push({
                                            id: `match_auto_${Date.now()}_${i}`,
                                            group: group,
                                            team1Id: nextRoundTeams[i],
                                            team2Id: nextRoundTeams[i+1],
                                            score1: null, score2: null, completed: false,
                                            time: "진행중", court: `${(i/2)+1}코트`,
                                            roundName: nextRoundLabel
                                        });
                                    } else {
                                        alert(`🎉 대진 구조상 [${nextRoundTeams[i]}]팀이 상위 라운드 추가 부전승 진출!`);
                                    }
                                }
                                updated = [...updated, ...nextMatches];
                            }
                        }
                    }
                }

                setMatches(updated);
                setLocalStorage('pb_matches', updated);
                if (completed) showToast("🏆 순위 및 전광판이 실시간 반영되었습니다!");
            };

            const updateTeamPlayers = (teamId, p1, p2) => {
                const updated = teams.map(t => t.id === teamId ? { ...t, player1: p1, player2: p2 } : t);
                setTeams(updated);
                setLocalStorage('pb_teams', updated);
                showToast("👤 명단 등록 완료!");
            };

            const getRankings = (groupName) => {
                const groupTeams = teams.filter(t => t.group === groupName);
                const groupMatches = matches.filter(m => m.group === groupName && m.completed);

                const stats = {};
                groupTeams.forEach(t => {
                    stats[t.id] = { id: t.id, name: t.name, p1: t.player1, p2: t.player2, wins: 0, losses: 0, pf: 0, pa: 0, played: 0 };
                });

                groupMatches.forEach(m => {
                    const t1 = stats[m.team1Id]; const t2 = stats[m.team2Id];
                    if (t1 && t2) {
                        t1.played++; t2.played++;
                        t1.pf += m.score1; t1.pa += m.score2;
                        t2.pf += m.score2; t2.pa += m.score1;
                        if (m.score1 > m.score2) { t1.wins++; t2.losses++; }
                        else { t2.wins++; t1.losses++; }
                    }
                });

                return Object.values(stats).sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    const diffA = a.pf - a.pa; const diffB = b.pf - b.pa;
                    if (diffB !== diffA) return diffB - diffA;
                    return b.pf - a.pf;
                });
            };

            const displayGroup = tvScreenMode === 'B_RANK' ? 'B' : 'A';
            const currentRankings = getRankings(displayGroup);

            return (
                <div className="min-h-screen bg-slate-950 text-white flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl">🏆</span>
                            <div>
                                <h1 className="text-xl font-black text-yellow-400 tracking-wider">CHURCH PICKLEBALL STADIUM</h1>
                                <p className="text-xs text-slate-400">교회 연합 피클볼 대회 전광판 라이브 시스템</p>
                            </div>
                        </div>
                        <nav className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-sm font-bold">
                            <button onClick={() => setActiveTab('tv')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'tv' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>📺 대형 TV 전광판</button>
                            <button onClick={() => setActiveTab('admin')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'admin' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>📱 iPhone 입력</button>
                            <button onClick={() => setActiveTab('teams')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'teams' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>👥 선수 명단</button>
                            <button onClick={() => setActiveTab('schedule')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'schedule' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>⚙️ 대진표 세팅</button>
                        </nav>
                    </header>

                    <main className="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
                        {activeTab === 'tv' && (
                          <div className="space-y-6">
                            <div className="flex flex-wrap justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 gap-2">
                                <div className="flex gap-2">
                                    <button onClick={() => { setTvScreenMode('A_RANK'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvScreenMode === 'A_RANK' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>{tournamentType==='league'?'A조 순위표':'A조 월드컵 트리'}</button>
                                    <button onClick={() => { setTvScreenMode('B_RANK'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvScreenMode === 'B_RANK' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>{tournamentType==='league'?'B조 순위표':'B조 월드컵 트리'}</button>
                                    <button onClick={() => { setTvScreenMode('LIVE_COURT'); setAutoRotate(false); }} className={`px-4 py-2 rounded-xl font-black text-xs ${tvScreenMode === 'LIVE_COURT' ? 'bg-emerald-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>🕒 실시간 코트현황</button>
                                </div>
                                <button onClick={() => setAutoRotate(!autoRotate)} className={`text-xs px-3 py-1.5 rounded-lg font-bold border ${autoRotate ? 'border-yellow-400/50 text-yellow-400' : 'border-slate-700 text-slate-500'}`}>
                                    {autoRotate ? '🔄 자동 화면순환 작동중 (12초 주기)' : '⏸️ 순환 일시중지'}
                                </button>
                            </div>

                            {/* [리그전 전광판 시상대] */}
                            {tournamentType === 'league' && (tvScreenMode === 'A_RANK' || tvScreenMode === 'B_RANK') && (
                                <div className="space-y-8">
                                    <div className="text-center py-6 bg-gradient-to-r from-yellow-400/5 via-slate-900 to-yellow-400/5 rounded-3xl border border-slate-800">
                                        <span className="bg-yellow-400 text-slate-950 text-xs font-black px-4 py-1 rounded-full uppercase tracking-widest">{displayGroup}조 라이브 리그 순위</span>
                                        <h2 className="text-3xl md:text-5xl font-black mt-2 tracking-tight">LEAGUE STANDINGS - GROUP {displayGroup}</h2>
                                    </div>

                                    {currentRankings.length === 0 ? (
                                        <div className="text-center py-20 bg-slate-900 rounded-3xl text-slate-500 font-bold">대진표가 생성되지 않았습니다.</div>
                                    ) : (
                                        <div className="space-y-10">
                                            {/* 완벽 교정: 진짜 올림픽 계단식 포디움 시상대 아키텍처 */}
                                            <div className="flex flex-col md:flex-row justify-center items-end gap-6 max-w-4xl mx-auto pt-16 pb-6">
                                                
                                                {/* 🥈 2위 (왼쪽) */}
                                                {currentRankings[1] && (
                                                    <div className="w-full md:w-72 bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-slate-700 rounded-3xl p-6 h-[260px] flex flex-col justify-between shadow-xl order-2 md:order-1 border-b-8 border-b-slate-400">
                                                        <div className="flex justify-between items-start"><span className="text-xs font-black text-slate-400 tracking-widest">2ND RANK</span><span className="text-3xl">🥈</span></div>
                                                        <div>
                                                            <div className="text-xs text-slate-500 font-black">{currentRankings[1].id}</div>
                                                            <h3 className="text-xl font-black text-white">{currentRankings[1].name}</h3>
                                                            <p className="text-xs text-slate-400">{currentRankings[1].p1 || '미등록'} & {currentRankings[1].p2 || '미등록'}</p>
                                                        </div>
                                                        <div className="border-t border-slate-800 pt-3 flex justify-between text-center text-xs font-bold">
                                                            <div><p className="text-slate-500 text-[10px]">전적</p><p className="text-sm font-black text-white">{currentRankings[1].wins}승</p></div>
                                                            <div><p className="text-slate-500 text-[10px]">득실차</p><p className="text-sm font-black text-amber-500">{(currentRankings[1].pf-currentRankings[1].pa) > 0 ? `+${currentRankings[1].pf-currentRankings[1].pa}` : currentRankings[1].pf-currentRankings[1].pa}</p></div>
                                                            <div><p className="text-slate-500 text-[10px]">총점</p><p className="text-sm font-black text-white">{currentRankings[1].pf}점</p></div>
                                                        </div>
                                                    </div>
                                                )}

                                                {/* 🏆 1위 (가운데 압도적 팝업 크기) */}
                                                {currentRankings[0] && (
                                                    <div className="w-full md:w-80 bg-gradient-to-b from-slate-900 to-slate-950 border-4 border-yellow-400 rounded-3xl p-6 h-[370px] flex flex-col justify-between shadow-2xl shadow-yellow-400/20 order-1 md:order-2 transform md:-translate-y-12 relative overflow-hidden border-b-[16px] border-b-yellow-400">
                                                        <div className="flex justify-between items-start"><span className="text-xs font-black text-yellow-400 tracking-wider">👑 CHAMPION LEADER</span><span className="text-5xl">🏆</span></div>
                                                        <div className="space-y-1 py-2">
                                                            <div className="text-sm text-yellow-400 font-black">{currentRankings[0].id}</div>
                                                            <h3 className="text-4xl font-black text-white tracking-tight">{currentRankings[0].name}</h3>
                                                            <p className="text-base text-yellow-200 font-bold">{currentRankings[0].p1 || '미등록'} & {currentRankings[0].p2 || '미등록'}</p>
                                                        </div>
                                                        <div className="border-t border-yellow-400/20 pt-4 flex justify-between text-center text-xs font-bold bg-yellow-400/5 p-3 rounded-xl">
                                                            <div><p className="text-yellow-400/60">승리</p><p className="text-xl font-black text-yellow-400">{currentRankings[0].wins}승</p></div>
                                                            <div><p className="text-yellow-400/60">득실차</p><p className="text-xl font-black text-amber-500">{(currentRankings[0].pf-currentRankings[0].pa) > 0 ? `+${currentRankings[0].pf-currentRankings[0].pa}` : currentRankings[0].pf-currentRankings[0].pa}</p></div>
                                                            <div><p className="text-yellow-400/60">총점</p><p className="text-xl font-black text-white">{currentRankings[0].pf}점</p></div>
                                                        </div>
                                                    </div>
                                                )}

                                                {/* 🥉 3위 (오른쪽 아담스케일) */}
                                                {currentRankings[2] && (
                                                    <div className="w-full md:w-72 bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-amber-800 rounded-3xl p-6 h-[200px] flex flex-col justify-between shadow-xl order-3 border-b-6 border-b-amber-700">
                                                        <div className="flex justify-between items-start"><span className="text-xs font-black text-amber-600 tracking-widest">3RD RANK</span><span className="text-2xl">🥉</span></div>
                                                        <div>
                                                            <div className="text-xs text-slate-500 font-black">{currentRankings[2].id}</div>
                                                            <h3 className="text-xl font-black text-white">{currentRankings[2].name}</h3>
                                                            <p className="text-xs text-slate-400">{currentRankings[2].p1 || '미등록'} & {currentRankings[2].p2 || '미등록'}</p>
                                                        </div>
                                                        <div className="border-t border-slate-800 pt-2 flex justify-between text-center text-xs font-bold">
                                                            <div><p className="text-slate-500 text-[10px]">전적</p><p className="text-sm font-black text-white">{currentRankings[2].wins}승</p></div>
                                                            <div><p className="text-slate-500 text-[10px]">득실차</p><p className="text-sm font-black text-amber-500">{(currentRankings[2].pf-currentRankings[2].pa) > 0 ? `+${currentRankings[2].pf-currentRankings[2].pa}` : currentRankings[2].pf-currentRankings[2].pa}</p></div>
                                                            <div><p className="text-slate-500 text-[10px]">총점</p><p className="text-sm font-black text-white">{currentRankings[2].pf}점</p></div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* 리그전 가독성 데이터 표 */}

                                    <div className="border-t border-slate-800 pt-4 space-y-5">
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-400 uppercase block">🏆 대회 대진 시스템 방식 선택</label>
                                            <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-2xl border border-slate-800">
                                                <button onClick={() => setTournamentType('league')} className={`py-3 rounded-xl font-black text-sm transition-all ${tournamentType === 'league' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>
                                                    풀 리그전 모드 (League)
                                                </button>
                                                <button onClick={() => setTournamentType('tournament')} className={`py-3 rounded-xl font-black text-sm transition-all ${tournamentType === 'tournament' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>
                                                    단판 토너먼트 모드 (Tournament)
                                                </button>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase">🅰️ A조 경기 세팅</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">A조 참여 팀수</label>
                                                    <input type="number" min="2" max="30" value={numTeamsA} onChange={(e) => setNumTeamsA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">팀당 제한 매치수 (리그용)</label>
                                                    <input type="number" disabled={tournamentType==='tournament'} min="1" max={numTeamsA} value={maxGamesA} onChange={(e) => setMaxGamesA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold disabled:opacity-20" />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase">🅱️ B조 경기 세팅</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">B조 참여 팀수</label>
                                                    <input type="number" min="2" max="30" value={numTeamsB} onChange={(e) => setNumTeamsB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">팀당 제한 매치수 (리그용)</label>
                                                    <input type="number" disabled={tournamentType==='tournament'} min="1" max={numTeamsB} value={maxGamesB} onChange={(e) => setMaxGamesB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold disabled:opacity-20" />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3 text-xs font-bold text-slate-400">
                                            <div className="space-y-1 col-span-2">
                                                <label>체육관 활성 코트 수</label>
                                                <select value={numCourts} onChange={(e) => setNumCourts(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white">
                                                    <option value={1}>1개 코트 운영</option>
                                                    <option value={2}>2개 코트 배치</option>
                                                    <option value={3}>3개 코트 가동</option>
                                                    <option value={4}>4개 코트 가동</option>
                                                </select>
                                            </div>
                                            <div className="space-y-1">
                                                <label>대회 첫경기 시작시간</label>
                                                <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-white text-center font-bold"/>
                                            </div>
                                            <div className="space-y-1">
                                                <label>경기 간격 주기 (분)</label>
                                                <input type="number" value={gameDuration} onChange={(e) => setGameDuration(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-white text-center"/>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={handleGenerateSchedule} className="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black rounded-2xl text-sm shadow-xl transition-all">
                                        🚀 최적화 맞춤 대진 스케줄 자동 빌드하기
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
