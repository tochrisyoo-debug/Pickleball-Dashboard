<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교회 피클볼 대회 실시간 전광판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white">
    <div id="root"></div>

    <script type="text/babel">
        // --- 실시간 로컬 저장소 동기화 엔진 ---
        const getLocalStorage = (key, defaultVal) => {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : defaultVal;
        };
        const setLocalStorage = (key, val) => {
            localStorage.setItem(key, JSON.stringify(val));
            window.dispatchEvent(new Event('storage_update'));
        };

        // 기본 초기 팀셋업 빌더 함수
        const buildInitialTeams = (countA, countB) => {
            const arr = [];
            for(let i=1; i<=countA; i++) {
                arr.push({ id: `A${i}`, group: 'A', name: `A${i}팀`, player1: `선수 ${i}A`, player2: `선수 ${i}B` });
            }
            for(let i=1; i<=countB; i++) {
                arr.push({ id: `B${i}`, group: 'B', name: `B${i}팀`, player1: `성도 ${i}A`, player2: `성도 ${i}B` });
            }
            return arr;
        };

        function App() {
            const [activeTab, setActiveTab] = React.useState('tv');
            
            // 조별 동적 팀 개수 및 최대 경기 수 세팅 상태창
            const [numTeamsA, setNumTeamsA] = React.useState(() => getLocalStorage('pb_numTeamsA', 6));
            const [numTeamsB, setNumTeamsB] = React.useState(() => getLocalStorage('pb_numTeamsB', 10));
            const [maxGamesA, setMaxGamesA] = React.useState(() => getLocalStorage('pb_maxGamesA', 5));
            const [maxGamesB, setMaxGamesB] = React.useState(() => getLocalStorage('pb_maxGamesB', 5));

            const [teams, setTeams] = React.useState(() => getLocalStorage('pb_teams', buildInitialTeams(6, 10)));
            const [matches, setMatches] = React.useState(() => getLocalStorage('pb_matches', []));
            
            const [selectedGroup, setSelectedGroup] = React.useState('A');
            const [tvGroup, setTvGroup] = React.useState('A');
            const [autoRotate, setAutoRotate] = React.useState(true);
            const [toast, setToast] = React.useState(null);

            const [numCourts, setNumCourts] = React.useState(3);
            const [startTime, setStartTime] = React.useState("10:00");
            const [gameDuration, setGameDuration] = React.useState(20);
            const [breakDuration, setBreakDuration] = React.useState(5);

            React.useEffect(() => {
                const handleStorageUpdate = () => {
                    setTeams(getLocalStorage('pb_teams', []));
                    setMatches(getLocalStorage('pb_matches', []));
                    setNumTeamsA(getLocalStorage('pb_numTeamsA', 6));
                    setNumTeamsB(getLocalStorage('pb_numTeamsB', 10));
                    setMaxGamesA(getLocalStorage('pb_maxGamesA', 5));
                    setMaxGamesB(getLocalStorage('pb_maxGamesB', 5));
                };
                window.addEventListener('storage_update', handleStorageUpdate);
                return () => window.removeEventListener('storage_update', handleStorageUpdate);
            }, []);

            React.useEffect(() => {
                if (!autoRotate) return;
                const interval = setInterval(() => {
                    setTvGroup(prev => prev === 'A' ? 'B' : 'A');
                }, 12000);
                return () => clearInterval(interval);
            }, [autoRotate]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };

            // 핵심: 골고루 안겹치게 원하는 만큼 대진을 추출하는 스마트 라운드로빈 엔진
            const generateSmartSchedule = () => {
                if (matches.length > 0 && !confirm("⚠️ 주의: 새로운 대진표를 만들면 기존 점수와 결과가 모두 삭제됩니다. 새로 만드시겠습니까?")) return;

                // 세팅값 영구 저장
                setLocalStorage('pb_numTeamsA', numTeamsA);
                setLocalStorage('pb_numTeamsB', numTeamsB);
                setLocalStorage('pb_maxGamesA', maxGamesA);
                setLocalStorage('pb_maxGamesB', maxGamesB);

                // 현재 세팅된 수에 맞추어 팀 목록 동적 확장/축소 및 기존 이름 보존 처리
                const updatedTeams = [];
                // Group A
                for(let i=1; i<=numTeamsA; i++) {
                    const existing = teams.find(t => t.id === `A${i}`);
                    updatedTeams.push(existing || { id: `A${i}`, group: 'A', name: `A${i}팀`, player1: '', player2: '' });
                }
                // Group B
                for(let i=1; i<=numTeamsB; i++) {
                    const existing = teams.find(t => t.id === `B${i}`);
                    updatedTeams.push(existing || { id: `B${i}`, group: 'B', name: `B${i}팀`, player1: '', player2: '' });
                }
                setTeams(updatedTeams);
                setLocalStorage('pb_teams', updatedTeams);

                // 라운드 로빈 슬라이스 빌더
                const makeTruncatedRoundRobin = (groupName, groupTeams, maxGamesLimit) => {
                    let list = [...groupTeams];
                    // 홀수면 부전승(BYE) 팀 강제 영입
                    const isOdd = list.length % 2 !== 0;
                    if (isOdd) list.push({ id: 'BYE', name: '부전승(쉬는팀)' });

                    const numTeams = list.length;
                    const totalRounds = numTeams - 1;
                    const roundsData = [];

                    for (let r = 0; r < totalRounds; r++) {
                        const currentRoundGames = [];
                        for (let i = 0; i < numTeams / 2; i++) {
                            const t1 = list[i];
                            const t2 = list[numTeams - 1 - i];
                            // 둘 다 진짜 팀일 때만 매치 성립 (부전승 매치는 자동 제외)
                            if (t1.id !== 'BYE' && t2.id !== 'BYE') {
                                currentRoundGames.push({ group: groupName, team1Id: t1.id, team2Id: t2.id });
                            }
                        }
                        roundsData.push(currentRoundGames);
                        // 원형 로테이션 회전 알고리즘
                        list.splice(1, 0, list.pop());
                    }

                    // 사용자가 지정한 '최대 경기수(라운드수)' 만큼만 골고루 칼같이 잘라내기!
                    const limit = Math.min(maxGamesLimit, totalRounds);
                    let slicedGames = [];
                    for(let k=0; k<limit; k++) {
                        slicedGames.push(...roundsData[k]);
                    }
                    return slicedGames;
                };

                const gamesA = makeTruncatedRoundRobin('A', updatedTeams.filter(t => t.group === 'A'), maxGamesA);
                const gamesB = makeTruncatedRoundRobin('B', updatedTeams.filter(t => t.group === 'B'), maxGamesB);
                let allGames = [...gamesA, ...gamesB];

                // 타임라인 및 코트 자동 배치 레이아웃 시스템
                let currentMin = (() => {
                    const [h, m] = startTime.split(':').map(Number);
                    return h * 60 + m;
                })();

                let courtIdx = 1;
                const finalMatches = allGames.map((g, idx) => {
                    const h = String(Math.floor(currentMin / 60) % 24).padStart(2, '0');
                    const m = String(currentMin % 60).padStart(2, '0');
                    const matchTime = `${h}:${m}`;
                    const courtName = `${courtIdx}코트`;

                    courtIdx++;
                    if (courtIdx > numCourts) {
                        courtIdx = 1;
                        currentMin += (Number(gameDuration) + Number(breakDuration));
                    }

                    return {
                        id: `match_${idx + 1}`,
                        ...g,
                        score1: null,
                        score2: null,
                        completed: false,
                        time: matchTime,
                        court: courtName
                    };
                });

                setMatches(finalMatches);
                setLocalStorage('pb_matches', finalMatches);
                showToast("🔥 모든 팀이 골고루 만나는 스마트 맞춤 대진표가 완성되었습니다!");
            };

            const saveScore = (matchId, s1, s2, completed) => {
                const updated = matches.map(m => m.id === matchId ? { ...m, score1: s1, score2: s2, completed } : m);
                setMatches(updated);
                setLocalStorage('pb_matches', updated);
                if (completed) showToast("🏆 결과가 저장되어 실시간 랭킹이 갱신되었습니다!");
            };

            const updateTeamPlayers = (teamId, p1, p2) => {
                const updated = teams.map(t => t.id === teamId ? { ...t, player1: p1, player2: p2 } : t);
                setTeams(updated);
                setLocalStorage('pb_teams', updated);
                showToast("👤 선수단 정보를 저장했습니다.");
            };

            const getRankings = (groupName) => {
                const groupTeams = teams.filter(t => t.group === groupName);
                const groupMatches = matches.filter(m => m.group === groupName && m.completed);

                const stats = {};
                groupTeams.forEach(t => {
                    stats[t.id] = { id: t.id, name: t.name, p1: t.player1, p2: t.player2, wins: 0, losses: 0, pf: 0, pa: 0, played: 0 };
                });

                groupMatches.forEach(m => {
                    const t1 = stats[m.team1Id];
                    const t2 = stats[m.team2Id];
                    if (t1 && t2) {
                        t1.played++; t2.played++;
                        t1.pf += m.score1; t1.pa += m.score2;
                        t2.pf += m.score2; t2.pa += m.score1;
                        if (m.score1 > m.score2) { t1.wins++; t2.losses++; }
                        else { t2.wins++; t1.losses++; }
                    }
                });

                return Object.values(stats).sort((a, b) => {
                    if (b.wins !== a.wins) return b.wins - a.wins;
                    const diffA = a.pf - a.pa;
                    const diffB = b.pf - b.pa;
                    if (diffB !== diffA) return diffB - diffA;
                    return b.pf - a.pf;
                });
            };

            const currentRankings = getRankings(tvGroup);

            return (
                <div className="min-h-screen bg-slate-950 text-white flex flex-col">
                    {toast && (
                        <div className="fixed top-5 right-5 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black px-6 py-3 rounded-2xl shadow-2xl z-50">
                            {toast}
                        </div>
                    )}

                    {/* 프리미엄 헤더 */}
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl">🏸</span>
                            <div>
                                <h1 className="text-xl font-black text-yellow-400 tracking-wider">CHURCH PICKLEBALL LIVE</h1>
                                <p className="text-xs text-slate-400">교회 맞춤형 실시간 랭킹 시스템 및 대진 스케줄러</p>
                            </div>
                        </div>
                        <nav className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-sm font-bold">
                            <button onClick={() => setActiveTab('tv')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'tv' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>Target TV 전광판</button>
                            <button onClick={() => setActiveTab('admin')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'admin' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>iPhone 입력</button>
                            <button onClick={() => setActiveTab('teams')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'teams' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>선수 명단</button>
                            <button onClick={() => setActiveTab('schedule')} className={`px-4 py-2 rounded-lg transition-all ${activeTab === 'schedule' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>대진표 세팅</button>
                        </nav>
                    </header>

                    <main className="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
                        
                        {/* 1위 대형 TV 대시보드 */}
                        {activeTab === 'tv' && (
                          <div className="space-y-6">
                            <div className="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                <div className="flex gap-2">
                                    <button onClick={() => { setTvGroup('A'); setAutoRotate(false); }} className={`px-5 py-2 rounded-xl font-black text-xs ${tvGroup === 'A' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>A조 스탠딩</button>
                                    <button onClick={() => { setTvGroup('B'); setAutoRotate(false); }} className={`px-5 py-2 rounded-xl font-black text-xs ${tvGroup === 'B' ? 'bg-yellow-400 text-slate-950' : 'bg-slate-950 text-slate-400'}`}>B조 스탠딩</button>
                                </div>
                                <button onClick={() => setAutoRotate(!autoRotate)} className={`text-xs px-3 py-1.5 rounded-lg font-bold border ${autoRotate ? 'border-yellow-400/50 text-yellow-400' : 'border-slate-700 text-slate-500'}`}>
                                    🔄 조 자동 교차화면: {autoRotate ? '작동중 (12초)' : '정지됨'}
                                </button>
                            </div>

                            <div className="text-center py-6 bg-gradient-to-r from-yellow-400/5 via-slate-900 to-yellow-400/5 rounded-3xl border border-slate-800">
                                <span className="bg-yellow-400 text-slate-950 text-xs font-black px-4 py-1 rounded-full uppercase tracking-widest">{tvGroup}조 실시간 순위 현황</span>
                                <h2 className="text-3xl md:text-5xl font-black mt-2 tracking-tight">STANDINGS - GROUP {tvGroup}</h2>
                            </div>

                            {currentRankings.length === 0 ? (
                                <div className="text-center py-20 bg-slate-900 rounded-3xl text-slate-500 font-bold">
                                    아직 대진표가 생성되지 않았거나 진행된 결과가 없습니다. [대진표 세팅] 탭을 진행해 주세요.
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    {/* 명예의 전당 메달존 */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                                        {/* 2위 */}
                                        {currentRankings[1] && (
                                            <div className="bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 h-64 flex flex-col justify-between shadow-xl order-2 md:order-1">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-xs font-black text-slate-400 uppercase tracking-widest">2ND RANK</span>
                                                    <span className="text-2xl">🥈</span>
                                                </div>
                                                <div>
                                                    <div className="text-xs text-slate-500 font-black">{currentRankings[1].id}</div>
                                                    <h3 className="text-xl font-black text-white">{currentRankings[1].name}</h3>
                                                    <p className="text-xs text-slate-400">{currentRankings[1].p1 || '이름 미등록'} & {currentRankings[1].p2 || '이름 미등록'}</p>
                                                </div>
                                                <div className="border-t border-slate-800 pt-3 grid grid-cols-3 text-center text-xs font-bold">
                                                    <div><p className="text-slate-500">전적</p><p className="text-sm font-black text-white">{currentRankings[1].wins}승 {currentRankings[1].losses}패</p></div>
                                                    <div><p className="text-slate-500">득실차</p><p className="text-sm font-black text-amber-500">{(currentRankings[1].pf-currentRankings[1].pa) > 0 ? `+${currentRankings[1].pf-currentRankings[1].pa}` : currentRankings[1].pf-currentRankings[1].pa}</p></div>
                                                    <div><p className="text-slate-500">득점</p><p className="text-sm font-black text-white">{currentRankings[1].pf}점</p></div>
                                                </div>
                                            </div>
                                        )}
                                        {/* 1위 */}
                                        {currentRankings[0] && (
                                            <div className="bg-slate-900 border-2 border-yellow-400 rounded-3xl p-6 h-72 flex flex-col justify-between shadow-2xl shadow-yellow-400/5 order-1 md:order-2">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-xs font-black text-yellow-400 uppercase tracking-widest">TOP LEADER</span>
                                                    <span className="text-3xl">🏆</span>
                                                </div>
                                                <div>
                                                    <div className="text-xs text-yellow-400/70 font-black">{currentRankings[0].id}</div>
                                                    <h3 className="text-2xl font-black text-white">{currentRankings[0].name}</h3>
                                                    <p className="text-xs text-slate-300">{currentRankings[0].p1 || '이름 미등록'} & {currentRankings[0].p2 || '이름 미등록'}</p>
                                                </div>
                                                <div className="border-t border-yellow-400/20 pt-3 grid grid-cols-3 text-center text-xs font-bold">
                                                    <div><p className="text-yellow-400/60">전적</p><p className="text-base font-black text-yellow-400">{currentRankings[0].wins}승 {currentRankings[0].losses}패</p></div>
                                                    <div><p className="text-yellow-400/60">득실차</p><p className="text-base font-black text-amber-500">{(currentRankings[0].pf-currentRankings[0].pa) > 0 ? `+${currentRankings[0].pf-currentRankings[0].pa}` : currentRankings[0].pf-currentRankings[0].pa}</p></div>
                                                    <div><p className="text-yellow-400/60">득점</p><p className="text-base font-black text-white">{currentRankings[0].pf}점</p></div>
                                                </div>
                                            </div>
                                        )}
                                        {/* 3위 */}
                                        {currentRankings[2] && (
                                            <div className="bg-slate-900 border-2 border-amber-800 rounded-3xl p-6 h-64 flex flex-col justify-between shadow-xl order-3">
                                                <div className="flex justify-between items-start">
                                                    <span className="text-xs font-black text-amber-600 uppercase tracking-widest">3RD RANK</span>
                                                    <span className="text-2xl">🥉</span>
                                                </div>
                                                <div>
                                                    <div className="text-xs text-slate-500 font-black">{currentRankings[2].id}</div>
                                                    <h3 className="text-xl font-black text-white">{currentRankings[2].name}</h3>
                                                    <p className="text-xs text-slate-400">{currentRankings[2].p1 || '이름 미등록'} & {currentRankings[2].p2 || '이름 미등록'}</p>
                                                </div>
                                                <div className="border-t border-slate-800 pt-3 grid grid-cols-3 text-center text-xs font-bold">
                                                    <div><p className="text-slate-500">전적</p><p className="text-sm font-black text-white">{currentRankings[2].wins}승 {currentRankings[2].losses}패</p></div>
                                                    <div><p className="text-slate-500">득실차</p><p className="text-sm font-black text-amber-500">{(currentRankings[2].pf-currentRankings[2].pa) > 0 ? `+${currentRankings[2].pf-currentRankings[2].pa}` : currentRankings[2].pf-currentRankings[2].pa}</p></div>
                                                    <div><p className="text-slate-500">득점</p><p className="text-sm font-black text-white">{currentRankings[2].pf}점</p></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* 종합 보드 표 */}
                                    <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-950 text-slate-400 text-xs font-bold border-b border-slate-800">
                                                    <th className="p-4 text-center">순위</th>
                                                    <th className="p-4">팀코드 / 팀명</th>
                                                    <th className="p-4">등록 선수조 명단</th>
                                                    <th className="p-4 text-center">경기수</th>
                                                    <th className="p-4 text-center text-emerald-400">승</th>
                                                    <th className="p-4 text-center text-rose-400">패</th>
                                                    <th className="p-4 text-center text-amber-500">득실차</th>
                                                    <th className="p-4 text-center">총득점</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/50 text-sm">
                                                {currentRankings.map((t, idx) => (
                                                    <tr key={t.id} className="hover:bg-slate-800/20">
                                                        <td className="p-4 text-center font-black text-slate-400">{idx + 1}위</td>
                                                        <td className="p-4 font-bold text-white"><span className="text-xs bg-slate-950 px-2 py-0.5 rounded text-slate-400 mr-2">{t.id}</span>{t.name}</td>
                                                        <td className="p-4 text-slate-300">{(t.p1 || t.p2) ? `${t.p1} & ${t.p2}` : <span className="text-slate-600 text-xs">선수 미지정</span>}</td>
                                                        <td className="p-4 text-center text-slate-400 font-bold">{t.played}</td>
                                                        <td className="p-4 text-center font-black text-emerald-400">{t.wins}</td>
                                                        <td className="p-4 text-center font-black text-rose-400">{t.losses}</td>
                                                        <td className="p-4 text-center font-black text-amber-500">{(t.pf-t.pa) > 0 ? `+${t.pf-t.pa}` : t.pf-t.pa}</td>
                                                        <td className="p-4 text-center font-black text-slate-200">{t.pf}점</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                          </div>
                        )}

                        {/* 2. 모바일 iPhone 터치 입력 스크린 */}
                        {activeTab === 'admin' && (
                            <div className="max-w-xl mx-auto space-y-4">
                                <div className="flex gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                                    <button onClick={() => setSelectedGroup('A')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'A' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>A조 매치제어</button>
                                    <button onClick={() => setSelectedGroup('B')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'B' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>B조 매치제어</button>
                                </div>

                                {matches.filter(m => m.group === selectedGroup).length === 0 ? (
                                    <div className="text-center py-12 text-slate-500 font-bold">현재 생성된 경기 목록이 없습니다. 대진표 구성을 먼저 완료해주세요!</div>
                                ) : (
                                    <div className="space-y-4">
                                        {matches.filter(m => m.group === selectedGroup).map(m => {
                                            const t1 = teams.find(t => t.id === m.team1Id);
                                            const t2 = teams.find(t => t.id === m.team2Id);
                                            const s1 = m.score1 !== null ? m.score1 : 0;
                                            const s2 = m.score2 !== null ? m.score2 : 0;

                                            return (
                                                <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                                                    <div className="flex justify-between items-center text-xs font-bold text-slate-400 border-b border-slate-800 pb-2">
                                                        <span>⏰ 예정시간 {m.time}</span>
                                                        <span className="bg-slate-950 text-yellow-400 px-2 py-0.5 rounded">{m.court}</span>
                                                        <span className={m.completed ? 'text-emerald-400' : 'text-amber-400'}>{m.completed ? '● 확정종료' : '○ 진행중'}</span>
                                                    </div>
                                                    <div className="grid grid-cols-7 items-center text-center">
                                                        {/* 팀 1 */}
                                                        <div className="col-span-3 space-y-1">
                                                            <div className="text-xs text-slate-500 font-black">{m.team1Id}</div>
                                                            <div className="font-bold text-sm text-white truncate">{t1?.name}</div>
                                                            {/* 피드백 반영: 등록된 실제 이름 모바일 보드 전면 노출 */}
                                                            <div className="text-[11px] text-slate-400 bg-slate-950/40 py-0.5 rounded px-1 truncate">
                                                                {t1 && (t1.player1 || t1.player2) ? `${t1.player1}, ${t1.player2}` : '선수 미지정'}
                                                            </div>
                                                            
                                                            <div className="flex flex-col items-center gap-1.5 pt-2">
                                                                <div className="flex items-center justify-center gap-1">
                                                                    <button onClick={() => saveScore(m.id, Math.max(0, s1 - 1), s2, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">-</button>
                                                                    <input 
                                                                        type="number" 
                                                                        value={m.score1 !== null ? m.score1 : ''} 
                                                                        placeholder="0"
                                                                        onChange={(e) => {
                                                                            const val = e.target.value === '' ? null : Number(e.target.value);
                                                                            saveScore(m.id, val, m.score2, false);
                                                                        }}
                                                                        className="w-12 h-8 bg-slate-950 border border-slate-800 rounded-lg text-center font-black text-base text-yellow-400 focus:outline-none focus:border-yellow-400"
                                                                    />
                                                                    <button onClick={() => saveScore(m.id, s1 + 1, s2, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">+</button>
                                                                </div>
                                                                {/* 피드백 반영: 11점 단번에 자동입력 패드 */}
                                                                <button onClick={() => saveScore(m.id, 11, s2, false)} className="px-2.5 py-0.5 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 rounded-md text-[11px] font-black hover:bg-yellow-400 hover:text-slate-950 transition-all">👑 11점 세팅</button>
                                                            </div>
                                                        </div>

                                                        <div className="col-span-1 text-xs font-black text-slate-600">VS</div>

                                                        {/* 팀 2 */}
                                                        <div className="col-span-3 space-y-1">
                                                            <div className="text-xs text-slate-500 font-black">{m.team2Id}</div>
                                                            <div className="font-bold text-sm text-white truncate">{t2?.name}</div>
                                                            {/* 피드백 반영: 등록된 실제 이름 모바일 보드 전면 노출 */}
                                                            <div className="text-[11px] text-slate-400 bg-slate-950/40 py-0.5 rounded px-1 truncate">
                                                                {t2 && (t2.player1 || t2.player2) ? `${t2.player1}, ${t2.player2}` : '선수 미지정'}
                                                            </div>
                                                            
                                                            <div className="flex flex-col items-center gap-1.5 pt-2">
                                                                <div className="flex items-center justify-center gap-1">
                                                                    <button onClick={() => saveScore(m.id, s1, Math.max(0, s2 - 1), false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">-</button>
                                                                    <input 
                                                                        type="number" 
                                                                        value={m.score2 !== null ? m.score2 : ''} 
                                                                        placeholder="0"
                                                                        onChange={(e) => {
                                                                            const val = e.target.value === '' ? null : Number(e.target.value);
                                                                            saveScore(m.id, m.score1, val, false);
                                                                        }}
                                                                        className="w-12 h-8 bg-slate-950 border border-slate-800 rounded-lg text-center font-black text-base text-yellow-400 focus:outline-none focus:border-yellow-400"
                                                                    />
                                                                    <button onClick={() => saveScore(m.id, s1, s2 + 1, false)} className="w-8 h-8 bg-slate-950 border border-slate-800 rounded-lg font-black text-sm">+</button>
                                                                </div>
                                                                {/* 피드백 반영: 11점 단번에 자동입력 패드 */}
                                                                <button onClick={() => saveScore(m.id, s1, 11, false)} className="px-2.5 py-0.5 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 rounded-md text-[11px] font-black hover:bg-yellow-400 hover:text-slate-950 transition-all">👑 11점 세팅</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="pt-2 border-t border-slate-800/50">
                                                        {m.completed ? (
                                                            <button onClick={() => saveScore(m.id, m.score1, m.score2, false)} className="w-full py-1.5 bg-slate-950 text-slate-400 text-xs font-bold rounded-xl border border-slate-800">🔒 락 해제 후 스코어 재수정</button>
                                                        ) : (
                                                            /* 피드백 반영: 11점 이상 승리 스코어 검증 유효성 가드 */
                                                            <button 
                                                                onClick={() => {
                                                                    if (s1 < 11 && s2 < 11) {
                                                                        alert("⚠️ 조기마감 차단 에러!\n최소한 한 팀의 점수가 11점 이상 스코어에 도달해야 경기 종료 확정이 가능합니다.\n(듀스인 경우에도 확인 필수)");
                                                                        return;
                                                                    }
                                                                    saveScore(m.id, s1, s2, true);
                                                                }} 
                                                                className="w-full py-2 bg-emerald-500 text-slate-950 text-xs font-black rounded-xl shadow-lg hover:bg-emerald-400 transition-colors"
                                                            >
                                                                경기 종료 및 결과 마감하기 🔒
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 3. 유연하고 동적인 선수 명단 관리 컴포넌트 */}
                        {activeTab === 'teams' && (
                            <div className="max-w-2xl mx-auto space-y-4">
                                <div className="flex gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                                    <button onClick={() => setSelectedGroup('A')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'A' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>A조 명단 ({numTeamsA}팀)</button>
                                    <button onClick={() => setSelectedGroup('B')} className={`flex-1 py-2.5 text-center rounded-xl font-black text-sm transition-all ${selectedGroup === 'B' ? 'bg-yellow-400 text-slate-950' : 'text-slate-400'}`}>B조 명단 ({numTeamsB}팀)</button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {teams.filter(t => t.group === selectedGroup).map(t => (
                                        <div key={t.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                                            <div className="flex items-center gap-2"><span className="text-xs bg-slate-950 px-2 py-0.5 rounded text-yellow-400 font-black">{t.id}</span><span className="font-bold text-sm">{t.name}</span></div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="text" value={t.player1} onChange={(e) => updateTeamPlayers(t.id, e.target.value, t.player2)} className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-white focus:border-yellow-400 focus:outline-none" placeholder="선수 1 이름"/>
                                                <input type="text" value={t.player2} onChange={(e) => updateTeamPlayers(t.id, t.player1, e.target.value)} className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-white focus:border-yellow-400 focus:outline-none" placeholder="선수 2 이름"/>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. [완전 개조] 스마트 제너레이터 대진 탭 */}
                        {activeTab === 'schedule' && (
                            <div className="max-w-xl mx-auto space-y-6">
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-6 shadow-xl">
                                    <div className="text-center">
                                        <span className="text-sm">⚙️</span>
                                        <h3 className="text-base font-black text-white mt-1">스마트 커스텀 대진 환경설정</h3>
                                        <p className="text-[11px] text-slate-400">대회 당일 출석 팀수와 가동 시간표에 맞춰 대진을 조율합니다.</p>
                                    </div>
                                    
                                    <div className="border-t border-slate-800/80 pt-4 space-y-4">
                                        {/* A조 동적 설정 제어기 */}
                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase tracking-wider">🅰️ A조 맞춤형 스케줄 조건</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">A조 총 참가 팀수</label>
                                                    <input type="number" min="2" max="30" value={numTeamsA} onChange={(e) => setNumTeamsA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">팀당 최대 매치수</label>
                                                    <input type="number" min="1" max={numTeamsA} value={maxGamesA} onChange={(e) => setMaxGamesA(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* B조 동적 설정 제어기 */}
                                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-3">
                                            <h4 className="text-xs font-black text-yellow-400 uppercase tracking-wider">🅱️ B조 맞춤형 스케줄 조건</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">B조 총 참가 팀수</label>
                                                    <input type="number" min="2" max="30" value={numTeamsB} onChange={(e) => setNumTeamsB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[11px] text-slate-400 block">팀당 최대 매치수</label>
                                                    <input type="number" min="1" max={numTeamsB} value={maxGamesB} onChange={(e) => setMaxGamesB(Number(e.target.value))} className="w-full bg-slate-900 border border-slate-800 p-2 text-sm rounded-xl text-white text-center font-bold" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* 코트 하드웨어 설정구역 */}
                                        <div className="grid grid-cols-2 gap-3 text-xs font-bold text-slate-400">
                                            <div className="space-y-1 col-span-2">
                                                <label>체육관 내 활성 피클볼 코트 개수</label>
                                                <select value={numCourts} onChange={(e) => setNumCourts(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-white">
                                                    <option value={1}>1개 코트 운영</option>
                                                    <option value={2}>2개 코트 가동</option>
                                                    <option value={3}>3개 코트 배치</option>
                                                    <option value={4}>4개 코트 가동</option>
                                                </select>
                                            </div>
                                            <div className="space-y-1">
                                                <label>대회 개시 시각</label>
                                                <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-white text-center font-bold"/>
                                            </div>
                                            <div className="space-y-1">
                                                <label>경기 순연 주기 (분)</label>
                                                <input type="number" value={gameDuration} onChange={(e) => setGameDuration(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-white text-center"/>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={generateSmartSchedule} className="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black rounded-2xl text-sm shadow-xl hover:opacity-90 active:scale-[0.99] transition-all">
                                        ✨ 안겹치고 골고루 매칭! 자동 대진표 생성
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
